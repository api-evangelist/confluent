method: derived
source: >-
  openapi/confluent-cloud-openapi.yaml (4xx/5xx responses across 504 operations) enriched from
  the Errors section of the same document's info.description
format: proprietary-json
rfc9457: false
rfc9457_note: >-
  Confluent does NOT use RFC 9457 application/problem+json anywhere. A grep of the harvested
  spec returns zero occurrences of problem+json. Confluent publishes its own error envelope,
  documented below, and Schema Registry uses a third shape again
  (application/vnd.schemaregistry.v1+json with a flat {error_code, message}).
envelope:
  description: The documented Confluent Cloud error envelope.
  example: |
    {
      "status": 400,
      "error": {
        "code": "INVALID_SCHEMA_FIELD",
        "message": "The 'name' field in the schema is required and cannot be empty.",
        "details": "Schemas must include a top-level 'name' field with a non-empty string value.",
        "timestamp": "2025-08-01T20:36:45Z",
        "path": "/api/v1/schemas",
        "suggestion": "Ensure the 'name' field is included in the payload and is not an empty string."
      },
      "requestId": "a1b2c3d4-e5f6-7890-g1h2-i3j4k516m7n8",
      "doc_url": "https://docs.confluent.io/cloud/current/api/errors/INVALID_SCHEMA_FIELD.html"
    }
  fields:
    status: {type: string, required: true, description: HTTP status code as a string}
    error.code: {type: string, required: true, description: Unique application-specific code in UPPER_SNAKE_CASE}
    error.message: {type: string, required: true, description: Actionable user-facing description, no trailing period}
    error.details: {type: string, required: false}
    error.timestamp: {type: string, required: true, description: ISO 8601 UTC}
    error.path: {type: string, required: true, description: The exact endpoint or resource path}
    error.suggestion: {type: string, required: false, description: Recommended remediation}
    requestId: {type: string, required: false, description: For tracing, debugging and support}
    doc_url: {type: string, required: false}
  divergence:
    - group: Connect v1
      note: Confluent states the Connect v1 API group uses a different error structure.
    - group: Schema Registry v1
      media_type: application/vnd.schemaregistry.v1+json
      schema: '#/components/schemas/ErrorMessage'
      note: >-
        Flat {error_code, message} with a five-digit numeric code, not the UPPER_SNAKE_CASE
        envelope above. This is the only part of the Confluent surface with a published,
        enumerable error-code registry, transcribed below.
finding_doc_url_is_dead:
  claim: >-
    The doc_url Confluent puts in its own error envelope points at a page that is not served.
  probed: https://docs.confluent.io/cloud/current/api/errors/INVALID_SCHEMA_FIELD.html
  http_status: 200
  effective_url: https://docs.confluent.io/index.html
  verdict: >-
    Soft-404. The per-error documentation host redirects every /cloud/current/api/errors/* path
    to the docs home page rather than serving an error page or returning 404. An agent that
    follows doc_url to self-remediate lands on the documentation index with no error context.
    /cloud/current/api/errors/index.html behaves identically.
