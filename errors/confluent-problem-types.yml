known_issues:
  - issue: Quota Exceeded
    description: Some "Quota Exceeded" errors are returned as HTTP 400 instead of HTTP 402.
    proposed_resolution: Return 402 consistently for "Quota Exceeded" errors.
    source: info.description "Known Issues" table of the published spec
