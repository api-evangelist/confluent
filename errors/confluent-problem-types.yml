agent_guidance:
  retry: >-
    Retry only 429 and 5XX, with capped exponential backoff plus jitter, per Confluent's own
    published guidance. Do NOT retry 400/401/403/404/409/422 — they are deterministic.
  danger: >-
    Because no idempotency key exists (see conventions/confluent-conventions.yml), retrying a
    failed POST is not safe in general. produceRecord in particular must not be blindly retried
    on an ambiguous failure: a timed-out produce may already have been written.
