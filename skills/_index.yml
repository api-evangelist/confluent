quality_signals:
  evals_as_contract: >-
    Every vendored skill ships an evals/evals.json alongside SKILL.md, and the repository
    enforces it — confluent-skill-reviewer audits eval coverage as one of three named gates.
    This is a materially stronger publishing posture than a skills directory alone.
  anti_triggers: >-
    Most skills carry explicit "Do NOT trigger for..." clauses in their description, which is a
    deliberate defence against trigger overlap; the repository ships
    scripts/check_trigger_overlap.py to test it.
  lazy_loading: >-
    Skills keep detail in references/ and instruct the agent to load only what it needs, rather
    than inlining everything into SKILL.md.
