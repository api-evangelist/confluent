  schemas:
    switchover.v1.SwitchoverEndpointSpec:
      type: object
      description: The desired state of the Switchover Endpoint
      properties:
        environment_crn:
          type: string
          format: uri
          description: 'The CRN of the environment this switchover endpoint belongs to — always its parent pair''s

            environment, derived from `parent_resource_crn` on create (ORC-9794 decision log).

            Read-only: accepting a second copy of the same scope would only create the possibility of

            the two disagreeing. It is also the value whose ID is passed as the `?environment=` query

            parameter on the other operations.

            '
          readOnly: true
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
        parent_resource_crn:
          type: string
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/switchover-pair=.+$
          description: 'The CRN of the switchover pair this endpoint is bound to. Must name the same environment as

            `environment_crn`: the pair is looked up in that scope, so a mismatch would report a

            confusing not-found rather than the inconsistency the caller introduced.

            '
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/switchover-pair=sw-00000
          x-immutable: true
        display_name:
          type: string
          description: A human-readable name for the switchover endpoint.
          example: prod-kafka-dr-endpoint
          maxLength: 256
        target:
          type: string
          description: 'The name of the endpoint that is currently active; always one of `endpoints[].name`.

            Output-only: the Switchover service derives it from the pair''s active member at create time

            and moves it on every failover. A value supplied on create is ignored.

            '
          example: west-platt
          readOnly: true
        endpoints:
          type: array
          description: 'The endpoint definitions, one per side (e.g. west/east). Must contain exactly 2 entries.

            '
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/switchover.v1.EndpointConfig'
          x-immutable: true
      x-enable-id: true
      x-enable-listmeta: true
      x-enable-objectmeta: true
    switchover.v1.SwitchoverEndpointList:
      type: object
      description: '`SwitchoverEndpoint` represents the endpoint-level Disaster Recovery configuration for a

        `SwitchoverPair`. It exposes a sticky DR bootstrap endpoint that clients connect to so they

        never need to update their bootstrap endpoint after a failover; that bootstrap endpoint is

        not part of this resource''s API representation (ORC-10133) and is obtained separately. For

        stateful pairs, the active endpoint follows the pair''s active member.


        The API allows you to list, create, read, update, and delete switchover endpoints.


        ## The Switchover Endpoints Model

        <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverEndpoint" />

        '
      required:
      - api_version
      - kind
      - metadata
      - data
      properties:
        api_version:
          type: string
          enum:
          - switchover/v1
          description: APIVersion defines the schema version of this representation of a resource.
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          readOnly: true
          enum:
          - SwitchoverEndpointList
        metadata:
          type: object
          description: Metadata for this collection response.
          required:
          - pagination
          properties:
            pagination:
              type: object
              description: Pagination metadata for this collection response.
              properties:
                page_size:
                  type: integer
                  format: int32
                  description: The user-requested page size for this pagination.
                  example: 10
                total_size:
                  type: integer
                  format: int32
                  description: The total number of items available in the full result set.
                  example: 23
                next_page_token:
                  type: string
                  description: An opaque pagination token for requesting the next page of results.
                expiration:
                  type: integer
                  format: int32
                  description: The number of seconds until `next_page_token` expires.
        data:
          type: array
          description: 'A data property that contains an array of resource items. Each entry in the array is a

            separate resource.

            '
          uniqueItems: true
          items:
            allOf:
            - $ref: '#/components/schemas/switchover.v1.SwitchoverEndpoint'
            - type: object
              required:
              - id
              - metadata
              - spec
              - status
              properties:
                spec:
                  type: object
                  required:
                  - display_name
                  - parent_resource_crn
                  - endpoints
                  - environment_crn
    switchover.v1.SwitchoverEndpointCondition:
      type: object
      description: 'A single status condition on a `SwitchoverEndpoint`, following the standard Kubernetes/Confluent

        condition pattern. Unlike a `SwitchoverPair` (whose conditions are per-member), an endpoint has

        a single resource-level condition.

        '
      required:
      - type
      - status
      properties:
        type:
          type: string
          description: The condition type. A `SwitchoverEndpoint` reports the single type `ResourceProvisioningComplete`.
          x-extensible-enum:
          - ResourceProvisioningComplete
          example: ResourceProvisioningComplete
        status:
          type: string
          description: The status of the condition.
          x-extensible-enum:
          - 'True'
          - 'False'
          - Unknown
          example: 'True'
        reason:
          type: string
          description: A machine-readable reason for the condition's current status.
          example: Reconciled
        message:
          type: string
          description: A human-readable message providing additional detail about the condition.
          example: The endpoint is ready.
    switchover.v1.SwitchoverEndpointUpdateRequest:
      type: object
      description: 'Request body for updating a `SwitchoverEndpoint`. Only `display_name` is mutable via this

        operation; use the `SwitchoverPair`''s `:failover` operation to change the active endpoint.

        '
      required:
      - spec
      properties:
        spec:
          type: object
          properties:
            display_name:
              type: string
              description: A human-readable name for the switchover endpoint.
              example: prod-kafka-dr-endpoint
              maxLength: 256
    Error:
      type: object
      description: Describes a particular error encountered while performing an operation.
      properties:
        id:
          description: A unique identifier for this particular occurrence of the problem.
          type: string
          maxLength: 255
        status:
          description: The HTTP status code applicable to this problem, expressed as a string value.
          type: string
        code:
          description: An application-specific error code, expressed as a string value.
          type: string
        title:
          description: A short, human-readable summary of the problem. It **SHOULD NOT** change from occurrence to occurrence of the problem, except for purposes of localization.
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
        source:
          type: object
          description: If this error was caused by a particular part of the API request, the source will point to the query string parameter or request body property that caused it.
          properties:
            pointer:
              description: A JSON Pointer [RFC6901] to the associated entity in the request document [e.g. "/spec" for a spec object, or "/spec/title" for a specific field].
              type: string
            parameter:
              description: A string indicating which query parameter caused the error.
              type: string
        error_code:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    switchover.v1.SwitchoverEndpoint:
      type: object
      description: '`SwitchoverEndpoint` represents the endpoint-level Disaster Recovery configuration for a

        `SwitchoverPair`. It exposes a sticky DR bootstrap endpoint that clients connect to so they

        never need to update their bootstrap endpoint after a failover; that bootstrap endpoint is

        not part of this resource''s API representation (ORC-10133) and is obtained separately. For

        stateful pairs, the active endpoint follows the pair''s active member.


        The API allows you to list, create, read, update, and delete switchover endpoints.



        Related guide: [Disaster Recovery for Kafka in Confluent Cloud](https://docs.confluent.io/cloud/current/clusters/cluster-linking/index.html).


        ## The Switchover Endpoints Model

        <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverEndpoint" />'
      properties:
        api_version:
          type: string
          enum:
          - switchover/v1
          description: APIVersion defines the schema version of this representation of a resource.
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          readOnly: true
          enum:
          - SwitchoverEndpoint
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace; it is normally unique across time but not space. That is, you can assume that the ID will not be reclaimed and reused after an object is deleted ("time"); however, it may collide with IDs for other object `kinds` or objects of the same `kind` within a different scope/namespace ("space").
          type: string
          maxLength: 255
          readOnly: true
          example: dlz-f3a90de
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/switchover/v1/switchover-endpoints/se-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/switchover-endpoint=se-12345
        spec:
          $ref: '#/components/schemas/switchover.v1.SwitchoverEndpointSpec'
        status:
          $ref: '#/components/schemas/switchover.v1.SwitchoverEndpointStatus'
    SearchFilter:
