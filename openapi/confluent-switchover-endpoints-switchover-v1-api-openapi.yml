    switchover.v1.EndpointFilter:
      type: object
      description: 'The client-supplied criteria that select which network endpoint to use for this side of the

        switchover pair. This filter is the only part of an endpoint side the caller provides; the

        resolved endpoint details on the parent `EndpointConfig` — `hostname`, `cloud`, `region`, and

        `connection_type` — are derived server-side from the selected network (or access point) and the

        `SwitchoverPair` member, not supplied here (ORC-10125).


        Set `type` to `public` or `private`. A `private` endpoint sets exactly one of `network_crn` or

        `access_point_crn`; each independently resolves a unique endpoint, so a second selector is never

        needed and could only disagree with the first. A `public` endpoint sets neither.


        There is deliberately no environment field: the environment is always recoverable without one —

        from `network_crn` or `access_point_crn` on a private entry, and from the switchover endpoint''s

        own `environment_crn` on a public entry. Carrying it here too would only duplicate that fact and

        let a caller name an environment that disagrees with the CRN beside it.

        '
      required:
      - type
      properties:
        type:
          type: string
          description: Whether the endpoint is private or public.
          x-extensible-enum:
          - private
          - public
          example: private
        network_crn:
          type: string
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/network=.+$
          description: 'CRN of the network to resolve this endpoint against. A private endpoint sets exactly one

            of this or `access_point_crn` — each independently resolves a unique endpoint, so a

            second selector is never needed and could only disagree with the first. A public

            endpoint sets neither.

            '
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/network=n-abc123
        access_point_crn:
          type: string
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/gateway=[^/]+/access-point=.+$
          description: 'CRN of the network access point, for access-point (PNI) endpoints — the alternative to

            `network_crn`; a private endpoint sets exactly one of the two. The `gateway` segment is

            part of the registered canonical form and is required.

            '
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/gateway=gw-456xyz/access-point=ap-west-xyz
  securitySchemes:
