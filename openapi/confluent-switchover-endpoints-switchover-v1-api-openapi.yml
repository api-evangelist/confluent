          type: string
          x-extensible-enum:
          - PROVISIONING
          - READY
          - FAILED
          - DEPROVISIONING
          description: "The lifecycle phase of the switchover endpoint:\n  PROVISIONING:    the endpoint is being created and reconciled;\n  READY:           the endpoint is reconciled and serving traffic;\n  FAILED:          the endpoint encountered an error;\n  DEPROVISIONING:  the endpoint is being deleted.\n"
          readOnly: true
          example: READY
        conditions:
          type: array
          description: Status conditions providing detailed information about the switchover endpoint's current state.
          items:
            $ref: '#/components/schemas/switchover.v1.SwitchoverEndpointCondition'
          readOnly: true
      readOnly: true
    switchover.v1.EndpointConfig:
      type: object
      description: Configuration for a single endpoint side of a `SwitchoverEndpoint`.
      required:
      - name
      - endpoint_filter
      properties:
        name:
          type: string
          description: A logical name for this endpoint side (e.g. "west-platt"), unique within the resource.
          example: west-platt
        hostname:
          type: string
          description: The resolved hostname for this endpoint. Set by the Switchover service.
          readOnly: true
          example: lkc-west-platt.us-west-2.aws.private.confluent.cloud
        cloud:
          type: string
          description: The cloud provider this endpoint resolves in. Output-only, derived server-side.
          readOnly: true
          example: aws
        region:
          type: string
          description: The cloud region this endpoint resolves in. Output-only, derived server-side.
          readOnly: true
          example: us-west-2
