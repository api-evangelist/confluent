openapi: 3.2.0
info:
  title: Confluent Subjects API
  version: v1
  description: 'Operations tagged Subjects across 2 of this provider''s published API definitions: schema-registry-api-spec.yaml, schema-registry-openapi.yaml. Each path carries the servers of the definition it was published in.'
tags:
- name: Subjects
paths:
  /subjects/{subject}/metadata:
    get:
      summary: Retrieve the latest version with the given metadata
      description: Retrieve the latest version with the given metadata.
      operationId: getLatestWithMetadata
      parameters:
      - name: subject
        in: path
        description: Subject under which the schema will be registered
        required: true
        schema:
          type: string
      - name: key
        in: query
        description: The metadata key
        schema:
          type: array
          items:
            type: string
      - name: value
        in: query
        description: The metadata value
        schema:
          type: array
          items:
            type: string
      - name: format
        in: query
        description: Desired output format, dependent on schema type
        schema:
          type: string
          default: ''
      - name: deleted
        in: query
        description: Whether to lookup deleted schemas
        schema:
          type: boolean
      responses:
        '200':
          description: The schema
          content:
            application/vnd.schemaregistry.v1+json:
              schema:
                $ref: '#/components/schemas/Schema'
            application/vnd.schemaregistry+json; qs=0.9:
              schema:
                $ref: '#/components/schemas/Schema'
            application/json; qs=0.5:
              schema:
                $ref: '#/components/schemas/Schema'
        '404':
          description: 'Error code 40401 -- Subject not found

            Error code 40403 -- Schema not found'
        '500':
          description: Internal server error
      tags:
      - Subjects
components:
  schemas:
    SchemaEntity:
      type: object
      properties:
        entityPath:
          type: string
        entityType:
          type: string
          enum:
          - sr_record
          - sr_field
    Metadata:
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            uniqueItems: true
            type: array
            items:
              type: string
        properties:
          type: object
          additionalProperties:
            type: string
        sensitive:
          uniqueItems: true
          type: array
          items:
            type: string
      description: User-defined metadata
    Rule:
      type: object
      properties:
        name:
          type: string
          description: Rule name
        doc:
          type: string
          description: Rule doc
        kind:
          type: string
          description: Rule kind
          enum:
          - TRANSFORM
          - CONDITION
        mode:
          type: string
          description: Rule mode
          enum:
          - UPGRADE
          - DOWNGRADE
          - UPDOWN
          - WRITE
          - READ
          - WRITEREAD
        type:
          type: string
          description: Rule type
        tags:
          uniqueItems: true
          type: array
          description: The tags to which this rule applies
          items:
            type: string
            description: The tags to which this rule applies
        params:
          type: object
          additionalProperties:
            type: string
            description: Optional params for the rule
          description: Optional params for the rule
        expr:
          type: string
          description: Rule expression
        onSuccess:
          type: string
          description: Rule action on success
        onFailure:
          type: string
          description: Rule action on failure
        disabled:
          type: boolean
          description: Whether the rule is disabled
      description: Rule
    Schema:
      type: object
      properties:
        subject:
          type: string
          description: Name of the subject
          example: User
        version:
          type: integer
          description: Version number
          format: int32
          example: 1
        id:
          type: integer
          description: Globally unique identifier of the schema
          format: int32
          example: 100001
        guid:
          type: string
          description: Globally unique identifier of the schema. In Confluent Cloud, this field is returned only if Confluent-Accept-Unknown-Properties header is passed in
        schemaType:
          type: string
          description: Schema type. In Confluent Cloud, this field is returned only if Confluent-Accept-Unknown-Properties header is passed in
          example: AVRO
        references:
          type: array
          description: References to other schemas
          items:
            $ref: '#/components/schemas/SchemaReference'
        metadata:
          $ref: '#/components/schemas/Metadata'
        ruleset:
          $ref: '#/components/schemas/RuleSet'
        schema:
          type: string
          description: Schema definition string
          example: '{"schema": "{"type": "string"}"}'
        schemaTags:
          type: array
          description: Schema tags
          items:
            $ref: '#/components/schemas/SchemaTags'
        ts:
          type: integer
          description: Timestamp when the schema version's record was last written; the version was registered then unless createTs is present. In Confluent Cloud, this field is returned only if Confluent-Accept-Unknown-Properties header is passed in
          format: int64
        createTs:
          type: integer
          description: Timestamp when the schema version was first registered. Present only when it differs from ts, i.e. the version's record was rewritten, as by a soft delete or an import; otherwise the version was registered at ts. In Confluent Cloud, this field is returned only if Confluent-Accept-Unknown-Properties header is passed in
          format: int64
        deleted:
          type: boolean
          description: Whether the schema has been deleted. In Confluent Cloud, this field is returned only if Confluent-Accept-Unknown-Properties header is passed in
        ruleSet:
          $ref: '#/components/schemas/RuleSet'
      description: Schema
    SchemaReference:
      type: object
      properties:
        name:
          type: string
          description: Reference name
          example: io.confluent.kafka.example.User
        subject:
          type: string
          description: Name of the referenced subject
          example: User
        version:
          type: integer
          description: Version number of the referenced subject
          format: int32
          example: 1
      description: Schema reference
    SchemaTags:
      type: object
      properties:
        schemaEntity:
          $ref: '#/components/schemas/SchemaEntity'
        tags:
          type: array
          items:
            type: string
    RuleSet:
      type: object
      properties:
        migrationRules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        domainRules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        encodingRules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        enableAt:
          type: string
          enum:
          - ALL
          - CLIENT
          - GATEWAY
          - SERVER
          - NONE
      description: Schema rule set
x-refined-from:
- schema-registry-api-spec.yaml
- schema-registry-openapi.yaml
