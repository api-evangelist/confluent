info:
  title: Confluent Cloud Scim Tokens (org/v2) API
  version: ''
  x-api-id: 46234552-5833-42eb-ba0f-883ad3f70d2b
  x-audience: external-public
  x-logo:
    url: https://assets.confluent.io/m/1661ef5e4ff82d3d/
  description: '# Introduction


    Note


    This documents the collection of Confluent Cloud APIs.'
servers:
- url: https://api.confluent.cloud
  description: Confluent Cloud API
tags:
- name: Scim Tokens (org/v2)
  description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


    `ScimToken` objects represent bearer tokens used for SCIM 2.0 API authentication.

    The token value is only returned when the token is first created and cannot be retrieved later.


    ## The Scim Tokens Model'
paths:
  /org/v2/scim-tokens:
    x-lifecycle-stage: General Availability
    x-self-access: true
    get:
      x-lifecycle-stage: General Availability
      x-self-access: true
      operationId: listOrgV2ScimTokens
      summary: List of Scim Tokens
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Retrieve a sorted, filtered, paginated list of all scim tokens.'
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
          maximum: 100
          x-max-page-items: 500
        description: A pagination size for collection requests.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: An opaque pagination token for collection requests.
      tags:
      - Scim Tokens (org/v2)
      security:
      - cloud-api-key: []
      - confluent-sts-access-token: []
      responses:
        '200':
          description: Scim Token.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/org.v2.ScimTokenList'
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The maximum number of requests you're permitted to make per time period.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of requests remaining in the current rate limit window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: "The relative time in seconds until the current rate-limit window resets.  \n  \n**Important:** This differs from Github and Twitter's same-named header which uses UTC epoch seconds. We use relative time to avoid client/server time synchronization issues."
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expire_duration_mins:
                  type: integer
                  format: int32
                  description: 'The duration in minutes after which the token expires.

                    Defaults to 6 months (259200 minutes) if not specified.

                    Minimum: 1 month (43200 minutes).

                    Maximum: 2 years (1051200 minutes).

                    '
                  example: 259200
                  default: 259200
                  minimum: 43200
                  maximum: 1051200
      x-lifecycle-stage: General Availability
      x-self-access: true
      operationId: createOrgV2ScimToken
      summary: Create a Scim Token
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Make a request to create a scim token.'
      tags:
      - Scim Tokens (org/v2)
      security:
      - cloud-api-key: []
      - confluent-sts-access-token: []
      responses:
        '201':
          description: A Scim Token was created.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The maximum number of requests you're permitted to make per time period.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of requests remaining in the current rate limit window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: "The relative time in seconds until the current rate-limit window resets.  \n  \n**Important:** This differs from Github and Twitter's same-named header which uses UTC epoch seconds. We use relative time to avoid client/server time synchronization issues."
            Location:
              schema:
                type: string
                format: uri
                example: https://api.confluent.cloud/org/v2/scim-tokens/{id}
              description: ScimToken resource uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org.v2.ScimToken'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
  /org/v2/scim-tokens/{id}:
    x-lifecycle-stage: General Availability
    x-self-access: true
    delete:
      x-lifecycle-stage: General Availability
      x-self-access: true
      operationId: deleteOrgV2ScimToken
      summary: Delete a Scim Token
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Make a request to delete a scim token.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the scim token.
      tags:
      - Scim Tokens (org/v2)
      security:
      - cloud-api-key: []
      - confluent-sts-access-token: []
      responses:
        '204':
          description: A Scim Token is being deleted.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The maximum number of requests you're permitted to make per time period.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of requests remaining in the current rate limit window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: "The relative time in seconds until the current rate-limit window resets.  \n  \n**Important:** This differs from Github and Twitter's same-named header which uses UTC epoch seconds. We use relative time to avoid client/server time synchronization issues."
