components:
  schemas:
    scim.v2.Error:
      type: object
      description: 'Standard SCIM error response format containing error details and status information.

        Returned when SCIM operations encounter validation errors or other issues.

        '
      properties:
        schemas:
          type: array
          description: The SCIM schema for the error response.
          items:
            type: string
            example: urn:ietf:params:scim:api:messages:2.0:Error
        status:
          type: string
          description: The HTTP status code of the error response.
        detail:
          type: string
          description: A human-readable description of the error.
    scim.v2.Meta:
      description: Metadata about the SCIM resource.
      type: object
      readOnly: true
      properties:
        resourceType:
          type: string
          description: The name of the resource type of the resource.
          example: User
        created:
          type: string
          format: date-time
          description: The DateTime the Resource was added to Confluent Cloud.
          example: '2025-01-01T12:00:00Z'
        lastModified:
          type: string
          format: date-time
          description: The most recent DateTime that the details of this Resource were updated.
          example: '2025-01-01T12:00:00Z'
        location:
          type: string
          format: uri
          description: The URI of the SCIM resource being returned.
          example: https://api.confluent.cloud/scim/v2/Users/u-12345
    SearchFilter:
      description: Filter a collection by a string search
      type: string
    scim.v2.User:
      type: object
      description: 'Represents a user account in Confluent Cloud managed through SCIM protocol.

        '
      properties:
        schemas:
          type: array
          description: The SCIM schema.
          items:
            type: string
            example: urn:ietf:params:scim:schemas:core:2.0:User
        id:
          type: string
          maxLength: 255
          description: Unique identifier for the User. Automatically assigned by Confluent Cloud.
          readOnly: true
          example: u-12345
        userName:
          type: string
          description: 'The user''s email address, which serves as their unique identifier in Confluent Cloud.

            '
          example: marty.mcfly@example.com
        name:
          type: object
          description: The user's full name.
          allOf:
          - $ref: '#/components/schemas/scim.v2.Name'
        active:
          type: boolean
          description: 'Indicates whether the user account is active and can access Confluent Cloud resources.

            '
          example: true
        meta:
          type: object
          description: Metadata about the resource.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/scim.v2.Meta'
    scim.v2.Name:
      description: The user's full name.
      type: object
      properties:
        givenName:
          type: string
          description: The user's first name.
          example: Marty
        familyName:
          type: string
          description: The user's last name.
          example: McFly
    scim.v2.PatchOp:
      type: object
      description: 'SCIM Patch operation for making partial updates to user attributes.

        Supports add, remove, and replace operations on specific user properties

        without requiring a full user object update.

        '
      properties:
        api_version:
          type: string
          enum:
          - scim/v2
          description: APIVersion defines the schema version of this representation of a resource.
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          readOnly: true
          enum:
          - PatchOp
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace; it is normally unique across time but not space. That is, you can assume that the ID will not be reclaimed and reused after an object is deleted ("time"); however, it may collide with IDs for other object `kinds` or objects of the same `kind` within a different scope/namespace ("space").
          type: string
          maxLength: 255
          readOnly: true
          example: dlz-f3a90de
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/scim/v2/patch-ops/po-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/patch-op=po-12345
        schemas:
          type: array
          description: The SCIM schema.
          items:
            type: string
            example: urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          type: array
          description: A list of patch operations.
          items:
            type: object
            required:
            - op
            properties:
              op:
                type: string
                description: The operation to perform.
                enum:
                - add
                - remove
                - replace
                example: replace
              path:
                type: string
                description: The attribute path describing the target of the operation.
                example: active
              value:
                oneOf:
                - type: string
                - type: boolean
                - type: object
                - type: array
                description: The value to be used within the operation.
                example: false
    ObjectMeta:
      description: ObjectMeta is metadata that all persisted resources must have, which includes all objects users must create.
      required:
      - self
      properties:
        self:
          description: Self is a Uniform Resource Locator (URL) at which an object can be addressed. This URL encodes the service location, API version, and other particulars necessary to locate the resource at a point in time
          type: string
          format: uri
          readOnly: true
          example: https://api.confluent.cloud/v2/kafka-clusters/lkc-f3a90de
        resource_name:
          description: Resource Name is a Uniform Resource Identifier (URI) that is globally unique across space and time. It is represented as a Confluent Resource Name
          type: string
          format: uri
          readOnly: true
          example: crn://confluent.cloud/kafka=lkc-f3a90de
        created_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was created. It is represented in RFC3339 format and is in UTC.
        updated_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was last updated. It is represented in RFC3339 format and is in UTC.
        deleted_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was (or will be) deleted. It is represented in RFC3339 format and is in UTC.
      readOnly: true
  securitySchemes:
    cloud-api-key:
      type: http
      scheme: basic
      description: Authenticate with Cloud API Keys using HTTP Basic Auth. Treat the Cloud API Key ID as the username and Cloud API Key Secret as the password.
    confluent-sts-access-token:
      type: oauth2
      description: Authenticate with Confluent API using this credentials (JSON Web Tokens) following OAuth 2.0.
      flows:
        clientCredentials:
          tokenUrl: https://api.confluent.cloud/sts/v1/oauth2/token
          scopes: {}
    global-api-key:
      type: http
      scheme: basic
      description: Authenticate with Global API Keys using HTTP Basic Auth. Treat the Global API Key ID as the username and Global API Key Secret as the password.
    resource-api-key:
      type: http
      scheme: basic
      description: Authenticate with resource-specific API Keys using HTTP Basic Auth. Treat the resource-specific API Key ID as the username and resource-specific API Key Secret as the password.
    external-access-token:
      type: oauth2
      description: Authenticate with Confluent API using this credentials (JSON Web Tokens) following OAuth 2.0.
      flows:
        clientCredentials:
          tokenUrl: https://api.confluent.cloud/sts/v1/oauth2/token
          scopes: {}
    oauth:
      type: oauth2
      description: Authenticate with OAuth 2.0. Currently this is only supported for partner APIs.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            partner:alter: enables partners to alter entitlements
            partner:create: enables partners to create entitlements and signup on behalf of customers
            partner:delete: enables partners to delete entitlements and organizations
            partner:describe: enables partners to read and list entitlements and organizations
