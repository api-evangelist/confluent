info:
  title: Confluent Cloud Statements (query/v1alpha1) API
  version: ''
  x-api-id: 46234552-5833-42eb-ba0f-883ad3f70d2b
  x-audience: external-public
  x-logo:
    url: https://assets.confluent.io/m/1661ef5e4ff82d3d/
  description: "# Introduction\n\n<div class=\"status-info\">\n<p class=\"status-info-title\">Note</p>\nThis documents the collection of Confluent Cloud APIs. Each API documents its\n<a href=\"#api-lifecycle-policy\">lifecycle phase</a>. APIs\nmarked as Early Access or Preview are not ready for production usage. We're currently\nworking with a select group of customers to get feedback and iterate on these APIs.\n</div>\n\nConfluent Cloud APIs are a core building block of Confluent Cloud. You can use the APIs to\nmanage your own account or to integrate Confluent into your product.\n\nMost of the APIs are organized around\n<a href=\"http://en.wikipedia.org/wiki/Representational_State_Transfer\" target=\"_blank\">REST</a>\nand the resources which make up Confluent Cloud. The APIs have predictable\nresource-oriented URLs, transport data using JSON, and use standard HTTP verbs,\nresponse codes, authentication, and design principles.\n\n## Object Model\n\n<div class=\"status-info\">\n<p class=\"status-info-title\">Note</p>\nThis section describes the object model for many Confluent Cloud APIs, but not all.\nThe Connect v1 API group has a different object model. You can review the example\nrequest and response bodies in <a href=\"../ccloud/connectors-connect-v-1/\">Connect v1 API</a>\nto see its object model.\n</div>\n\nConfluent Cloud APIs are primarily designed to be declarative and intent-oriented. In other words,\ntell the API what you want (for example, throughput or SLOs) and it will figure out how to make it happen\n(for example, cluster sizing). A Confluent object acts as a \"record of intent\" — after you create the\nobject, Confluent Cloud will work tirelessly in the background to ensure that the object exists\nas specified.\n\nConfluent APIs represent objects in JSON with media-type `application/json`.\n\nMany objects follow a model consisting of `spec` and `status`. An object's `spec` tells\nConfluent the _desired state_ (specification) of the resource. The object may not be\nimmediately available or changes may not be immediately applied. For this reason,\nmany objects also have a `status` property that provides info about the\n_current state_ of the resource. Confluent Cloud is continuously and actively managing\neach resource's current state to match it's desired state.\n\nAll Confluent objects share a set of common properties:\n\n- **api_version** – API objects have an `api_version` field indicating their API version.\n- **kind** – API objects have a `kind` field indicating the kind of object it is.\n- **id** – Each object in the API will have an identifier, indicated via its `id` field,\n  and should be treated as an opaque string unless otherwise specified.\n\nThere are a number of other [standard properties](#standard-properties) and that you'll encounter\nused by many API objects. And of course, objects have plenty of non-standard fields that are\nspecific to each object _kind_... this is what makes them interesting!\n\n# Authentication\n\nConfluent uses API keys and JSON Web Tokens (JWTs) to integrate your applications\nand workflows to your Confluent Cloud resources using the Confluent Cloud REST APIs.\nYour applications and workflows must be authenticated and authorized in order to\naccess and manage Confluent Cloud resources.\n\n## API keys\n\nYou can create and manage your API keys using the Confluent Cloud Console or\nConfluent CLI. For more information, see [Use API Keys to Control Access in Confluent Cloud](https://docs.confluent.io/cloud/current/access-management/authenticate/api-keys/api-keys.html).\n\nConfluent Cloud uses the following two categories of API keys:\n\n- A **Cloud API key** grants access to the Confluent Cloud Management APIs,\n  such as for Provisioning and Metrics integrations.\n- A **resource-specific API key** grants access to a Confluent Kafka cluster\n  (Kafka API key), a Confluent Cloud Schema Registry (Schema Registry API key),\n  Flink (Flink API key scoped to an Environment + Region pair), or a ksqlDB application.\n\nEach Confluent Cloud API key is associated with a principal (specific user or\nservice account) and inherits the permissions granted to the owner.\n\n- For example, if service account `Armageddon` is granted ACLs on Kafka cluster\n  `neptune`, then a Kafka API Key for `neptune` owned by `Armageddon` will have\n  these ACLs enforced.\n- **Note:** API keys are automatically deleted when the associated user or service\n  account is deleted (for example, when an employee leaves the company or moves to\n  a new department and an SSO integration removes the Confluent Cloud user as they\n  no longer require access).\n- Confluent **strongly recommends** that you use service accounts for all\n  production-critical access.\n\nConfluent Cloud API keys grant access to Confluent Cloud resources, so **keep them secure**!\nDo not share your API keys and secrets in publicly-accessible locations, such as\nGitHub or client-side code.\n\nAll API requests must be made over HTTPS. Calls made over plain HTTP will fail.\nAPI requests without authentication will also fail.\n\nTo use an API key, you must send it in an `Authorization: Basic {credentials}` header.\nRemember that HTTP Basic authentication requires you to provide your credentials as\nthe API key ID and associated API secret separated by a colon and encoded using Base64\nformat. For example, if your API key ID is `ABCDEFGH123456789` and the API key Secret\nis `XNCIW93I2L1SQPJSJ823K1LS902KLDFMCZPWEO`, then the authorization header is:\n\n```text​\nAuthorization: Basic QUJDREVGR0gxMjM0NTY3ODk6WE5DSVc5M0kyTDFTUVBKU0o4MjNLMUxTOTAyS0xERk1DWlBXRU8=\n```\n\nYou can generate this header example from the API key:\n\nmacOS:\n\n```shell\n$ echo -n \"ABCDEFGH123456789:XNCIW93I2L1SQPJSJ823K1LS902KLDFMCZPWEO\" | base64\n\n```\n\nLinux:\n\n```shell\n$ echo -n \"ABCDEFGH123456789:XNCIW93I2L1SQPJSJ823K1LS902KLDFMCZPWEO\" | base64 -w 0\n```\n\nWindows (PowerShell only):\n\nThis command is only supported for PowerShell and will not work in the Command shell. \n\n```shell\n$ [System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes(\"ABCDEFGH123456789:XNCIW93I2L1SQPJSJ823K1LS902KLDFMCZPWEO\"))\n```\n\nTo find out if an API operation supports Cloud API Keys, look in the **AUTHORIZATIONS**\nlisting for `cloud-api-key`.\n\nTo find out if an API operation supports resource-specific API Keys, look in the **AUTHORIZATIONS**\nlisting for `resource-api-key`.\n\n## External OAuth\n\nYou can use [OAuth/OIDC support for Confluent Cloud](https://docs.confluent.io/cloud/current/access-management/authenticate/oauth/overview.html)\nto authenticate and authorize access to applications and workloads for the\nfollowing Confluent Cloud REST APIs:\n\n- **Kafka REST API**: [Kafka REST API for Clusters(V3)](../ccloud/cluster-v-3/).\n  For an API overview and examples, see [Cluster Management with Kafka REST API](https://docs.confluent.io/cloud/current/kafka-rest/kafka-rest-cc.html).\n- **Schema Registry REST API**: [Schema Registry REST API for Schemas(V1)](../ccloud/schemas-v-1/)\n  and [Subjects](../ccloud/subjects-v-1/).\n  For an API overview and examples, see [Schema Registry REST API for Confluent Cloud](https://docs.confluent.io/cloud/current/sr/sr-rest-apis.html).\n\nAlternatively, to find out if an API operation supports external tokens, look in the **AUTHORIZATIONS**\nlisting for `external-access-token`.\n\n## Confluent STS tokens\n\nConfluent Security Token Service (STS) issues access tokens (`confluent-sts-access-token`)\nby exchanging an external token (`external-access-token`) for a `confluent-sts-access-token`. You can use\nConfluent STS tokens to authenticate to Confluent Cloud APIs that support the\n`confluent-sts-access-token` notation.\n\nTo find out if an API operation supports Confluent STS tokens, look in the **AUTHORIZATIONS**\nlisting for `confluent-sts-access-token`.\n\n## Partner OAuth\n\nApproved partners can fetch Partner tokens (`confluent-partner-access-token`) that validate their identity\nand grant access to the Partner API (`partner/v2`), which lets them sign up\nan organization on behalf of a customer, manage entitlements (create, read, and list),\nand read or list organizations they have signed up.\n\nTo find out an API operation supports Partner tokens, look in the **AUTHORIZATIONS**\nlisting for `confluent-partner-access-token`.\n\n<!-- TODO: port this back to the Confluent API Design Guide -->\n\n<SecurityDefinitions />\n\n# Errors\n\nConfluent API error messages are a critical part of the developer experience. For Confluent Cloud, they must be\nclear, consistent, actionable, and designed for both developers and automated systems. Strong error\nhandling supports fast troubleshooting, reliable integration, and efficient support–the foundation of\na positive developer experience.\n\nOur APIs are built on RESTful principles. They use resource-oriented URLs, standard HTTP verbs, and JSON\nfor requests and responses. This section defines clear standards for structuring, formatting, and documenting\nerror messages for all Confluent REST APIs.\n\n<div class=\"status-info\">\n<p class=\"status-info-title\">Note</p>\nThis error format applies to most Confluent Cloud APIs. However, the Connect v1 API group uses a different structure. For Connect v1-specific error behavior and examples, refer to the Connect v1 API documentation <a href=\"../ccloud/connectors-connect-v-1/\">below</a> to see its error behavior.\n</div>\n\n## Key principles\n\nUse the following best practices when designing and documenting API error messages:\n\n- **Ensure clarity and consistency**: Messages must be easy to understand–use active voice and plain language–and consistently formatted across endpoints.\n\n- **Write actionable messages**: Always include a resolution or next step, enabling users to correct the problem.\n\n- **Avoid exposing sensitive data**: Never expose internal system details, stack traces, logs, or user-specific content.\n\n- **Follow industry best practices**: Don't use a period at the end of the message field, even if it is a full sentence. This follows industry standards. Use periods in the details and suggestion fields if the content is a complete sentence. View the [API best practices blog](#status-codes) by Postman, a trusted API leader.\n\n## HTTP status codes\n\nConfluent Cloud APIs return standard [HTTP status codes](#status-codes) to\nindicate the outcome of API request. Each error response includes a `status` field that reflects the appropriate HTTP code as a string (for example, `\"403\"` or `\"404\"`).\nFor a list of supported codes and their meaning, see the [HTTP status codes](#status-codes) section.\n\n## Error response structure\n\nEach API error response **should** include the following fields:\n\n**Top-level fields**\n\n| Field        | Type   | Required | Description                                                                                                                                             |\n| ------------ | ------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| status       | String | Yes      | HTTP status code (for example, 400, 404, 500).                                                                                                          |\n| error        | Object | Yes      | Main object containing error details.                                                                                                                   |\n| requestId    | String | Optional | Unique identifier for the API request. Use for tracing, debugging, and support inquiries.                                                               |\n| doc_url      | String | Optional | Link to relevant documentation or troubleshooting steps.                                                                                                |\n\n**Fields inside `error` object**\n\n| Field       | Type   | Required | Description                                                                                                                                             |\n| ------------| ------ | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------- |\n|  code       | String | Yes      | Unique, application-specific error code. Write error codes in uppercase letters, using underscores to separate words (for example, RESOURCE_NOT_FOUND). |\n|  message    | String | Yes      | Clear, actionable, user-friendly description of what went wrong using active voice.                                                                     |\n|  details    | String | Optional | Additional explanation or context about the error using active voice.                                                                                   |\n|  timestamp  | String | Yes      | ISO 8601 UTC timestamp indicating the date and time when the error occurred.                                                                            |\n|  path       | String | Yes      | The exact API endpoint or resource path related to the error.                                                                                           |\n|  suggestion | String | Optional | Recommend actions the user can take to fix or avoid the error using active voice.                                                                       |\n\nEach Confluent API error includes a status and a structured error object with a code, message, and optional context to help you understand and resolve the issue. The following example\nshows a standard Confluent API error response in JSON format:\n\n    {\n      \"status\": 400,\n      \"error\": {\n        \"code\": \"INVALID_SCHEMA_FIELD\",\n        \"message\": \"The 'name' field in the schema is required and cannot be empty.\",\n        \"details\": \"Schemas must include a top-level 'name' field with a non-empty string value.\",\n        \"timestamp\": \"2025-08-01T20:36:45Z\",\n        \"path\": \"/api/v1/schemas\",\n        \"suggestion\": \"Ensure the 'name' field is included in the payload and is not an empty string.\"\n      },\n      \"requestId\": \"a1b2c3d4-e5f6-7890-g1h2-i3j4k516m7n8\",\n      \"doc_url\": \"https://docs.confluent.io/cloud/current/api/errors/INVALID_SCHEMA_FIELD.html\"\n    }\n\nNote that if a request fails validation, it will return an HTTP `422 Unprocessable Entity`\nwith a list of fields that failed validation.\n\n## Pagination\n\n<div class=\"status-info\">\n<p class=\"status-info-title\">Note</p>\nThis section describes the pagination behavior of “list” operations for many Confluent Cloud APIs, but not all.\nThe Connect V1 and Kafka V3 API list operations do not support pagination.\n</div>\n\nAll API resources have support for bulk reads via \"list\" API operations. For example,\nyou can \"list Kafka clusters\", \"list api keys\", and \"list environments\". These \"list\"\noperations require pagination; by requesting smaller subsets of data, API clients\nreceive a response much faster than requesting the entire, potentially large, data set.\n\nAll \"list\" operations follow the same pattern with the following parameters:\n\n- `page_size` – client-provided max number of items per page, only valid on the first request.\n- `page_token` – server-generated token used for traversing through the result set.\n\nA paginated response may include any of the following pagination links. API clients may\nfollow the respective link to page forward or backward through the result set as desired.\n\n| [Link Relation](https://www.iana.org/assignments/link-relations/link-relations.xml) | Description                                                                                                                                                                             |\n| ----------------------------------------------------------------------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `next`                                                                              | A link to the next page of results. A response that does not contain a next link does not have further data to fetch.                                                                   |\n| `prev`                                                                              | A link to the previous page of results. A response that does not contain a prev link has no previous data. This link is **optional** for collections that cannot be traversed backward. |\n| `first`                                                                             | A link to the first page of results. This link is **optional** for collections that cannot be indexed directly to a given page.                                                         |\n| `last`                                                                              | A link to the last page of results. This link is **optional** for collections that cannot be indexed directly to a given page.                                                          |\n\nAPI clients must treat pagination links and the `page_token` parameter in particular as an opaque string.\n\nAn example paginated list response may look like\n\n```\n{\n    \"api_version\": \"v2\",\n    \"kind\": \"KafkaClusterList\",\n    \"metadata\": {\n        \"next\": \"https://api.confluent.cloud/kafka-clusters?page_token=ABCDEFGHIJKLMNOP1234567890\"\n    }\n    \"data\": [\n        {\n            \"metadata\": {\n                \"id\": \"lkc-abc123\",\n                \"self\": \"https://api.confluent.cloud/kafka-clusters/lkc-abc123\",\n                \"resource_name\": \"crn://confluent.cloud/kafka=lkc-abc123\",\n            }\n            \"spec\": {\n                \"display_name\": \"My Kafka Cluster\",\n                <snip>\n            },\n            \"status\": {\n                \"phase\": \"RUNNING\",\n                <snip>\n            }\n        },\n        <snip>\n    ]\n}\n```\n\n# Rate Limiting\n\nTo protect the stability of the API and keep it available to all users, Confluent employs\nmultiple safeguards. If you send too many requests in quick succession or perform too many\nconcurrent operations, you may be throttled or have your request rejected with an error.\n\nWhen a rate limit is breached, an HTTP `429 Too Many Requests` error is\nreturned. The following headers are sent back to provide assistance in dealing\nwith rate limits. Note that headers are not returned for a `429` error response with\n[Kafka REST API (v3)](../ccloud/cluster-v-3/).\n\n| Header                  | Description                                                                                                                                                                                                                                        |\n| ----------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `X-RateLimit-Limit`     | The maximum number of requests you're permitted to make per time period.                                                                                                                                                                           |\n| `X-RateLimit-Reset`     | The relative time in seconds until the current rate limit window resets.                                                                                                                                                                           |\n| `Retry-After`           | The number of seconds to wait until the rate limit window resets. Only sent when the rate limit is reached.                                                                                                                                        |\n| `X-RateLimit-Remaining` | The number of requests remaining in the current rate-limit window. **Important:** This differs from Github and Twitter\\'s same-named header which uses UTC epoch seconds. We use relative time to avoid client/server time synchronization issues. |\n\nConfluent enforces multiple kinds of limits, including request-rate and concurrency limits, both per user and organization-wide. Unauthenticated requests are associated with the originating IP address, not the user making requests.\n\nIntegrations should gracefully handle these limits by watching for `429` error responses and\nbuilding in a retry mechanism. This mechanism should follow a capped exponential backoff policy to\nprevent [retry amplification](https://landing.google.com/sre/sre-book/chapters/addressing-cascading-failures/)\n(\"retry storms\") and also introduce some randomness (\"jitter\") to avoid the\n[thundering herd effect](https://en.wikipedia.org/wiki/Thundering_herd_problem).\n\nRate limits are generally fixed and cannot be increased. If you require higher\nthroughput, you can use a Dedicated cluster, where certain limits scale\nautomatically with the number of CKUs. For example, each additional CKU\nincreases the Kafka REST Produce v3 connection limit by 300 requests per\nsecond. For reference, see the\n[eCKU/CKU comparison table](https://docs.confluent.io/cloud/current/clusters/cluster-types.html#ecku-cku-comparison).\n\nIf you’re running into this error and think you need a higher rate limit, contact Confluent at\n[support@confluent.io](mailto:support@confluent.io).\n\n# Identifiers and URLs\n\nMost resources have multiple identifiers:\n\n- `id` is the \"natural identifier\" for an object. It is only unique within its parent resource.\n  The `id` is unique across time: the ID will not be reclaimed and reused after an object is deleted.\n- `resource_name` is a Uniform Resource Identifier (URI) that is globally unique across all resources.\n  This encompasses all parent resource `kind`s and `id`s necessary to uniquely identify a particular\n  instance of this object `kind`. Because it uses object `id`s, the CRN will not be reclaimed and\n  reused after an object is deleted. It is represented as a Confluent Resource Name (see below).\n- `self` is a Uniform Resource Locator (URL) at which an object can be addressed.\n  This URL encodes the service location, API version, and other particulars necessary to\n  locate the resource at a point in time.\n\nTo see how these relate to each other, consider `KafkaBroker` with `broker.id=2` in a `KafkaCluster`\nin Confluent Cloud identified as `lkc-xsi8201`. In such an example, the `KafkaBroker` has `id=2`,\nthe `resource_name` is `crn://confluent.cloud/kafka=lkc-xsi8201/broker=2` and the `self` URL may be\nsomething like `https://pkc-8wlk2n.us-west-2.aws.confluent.cloud`. Note that different identifiers\ncarry different information for different purposes, but the `resource_name` is the most complete\nand canonical identifier.\n\n## Confluent Resource Names (CRNs)\n\n_Confluent Resource Names_ (CRNs) are used to uniquely identify all Confluent resources.\n\nA CRN is a valid URI having an \"authority\" of `confluent.cloud` or a self-managed\n<a href=\"https://docs.confluent.io/current/security/rbac/configure-mds/index.html\" target=\"_blank\">\nmetadata service URL</a>, followed by the minimal hierarchical set of key-value\npairs necessary to uniquely identify a resource.\n\nHere are some examples for basic resources in Confluent Cloud:\n\n| Resource                   | Example CRN                                                                                                                                                              |\n| -------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| Organization               | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a                                                                                                  |\n| Environment                | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy                                                                            |\n| User                       | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/user=u-rst9876                                                                                   |\n| API Key                    | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/user=u-zyx98/api-key=ABCDEFG9876543210                                                           |\n| Service Account            | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/service-account=sa-abc1234                                                                       |\n| Kafka Cluster              | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/cloud-cluster=lkc-123abc/kafka=lkc-123abc                                  |\n| Kafka Topic                | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/cloud-cluster=lkc-123abc/kafka=lkc-123abc/topic=my_kafka_topic             |\n| Consumer Group             | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/cloud-cluster=lkc-123abc/kafka=lkc-123abc/group=confluent_cli_consumer_123 |\n| Network                    | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/network=n-123abc                                                           |\n| Peering                    | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/network=n-123abc/peering=p-123abc                                          |\n| Private Link Access        | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/network=n-123abc/private-link-access=pla-123abc                            |\n| Transit Gateway Attachment | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/network=n-123abc/transit-gateway-attachment=tgwa-123abc                    |\n| Schema Registry Cluster    | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/schema-registry=lsrc-789qw                                                 |\n| Schema Subject             | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/schema-registry=lsrc-789qw/subject=test                                    |\n| KEK                        | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/schema-registry=lsrc-789qw//kek=test_kek                                   |\n| Connector                  | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/cloud-cluster=lkc-123abc/connector=my_datagen_connector                    |\n| Provider Integration       | crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-456xy/provider-integration=cspi-123j1                                            |\n\n# Data Types\n\n## Primitive Types\n\n| Data Type | Representation                                                                                                                                                                                                                                                                                                                                                                                                                          |\n| --------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Integers  | Each API may specify the type as `int32` or `int64`. Note that many languages, including JavaScript, are limited to a max size of approx `2**53` and don't correctly handle large `int64` values with their default JSON parser.                                                                                                                                                                                                        |\n| Dates     | <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> formatted string. UTC timezones are assumed, unless otherwise given.                                                                                                                                                                                                                                                                                        |\n| Times     | <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> formatted string. UTC timezones are assumed, unless otherwise given.                                                                                                                                                                                                                                                                                        |\n| Durations | <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> formatted string.                                                                                                                                                                                                                                                                                                                                           |\n| Periods   | <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> formatted string. UTC timezones are assumed, unless otherwise given.                                                                                                                                                                                                                                                                                        |\n| Ranges    | All ranges are represented using half-open intervals with naming conventions like `[start_XXX, end_XXX)` such as `[start_time, end_time)`.                                                                                                                                                                                                                                                                                              |\n| Enums     | Most APIs use <a href=\"https://opensource.zalando.com/restful-api-guidelines/#112\" target=\"_blank\">`x-extensible-enum`</a> as an open-ended list of values. This improves compatibility compared with a standard `enum` which by definition represents a closed set. All enums have a `0`-valued entry which either serves as the default for common cases, or represents `UNSPECIFIED` when no default exists and results in an error. |\n\n<!-- TODO\n### Standard Objects\n\n| Money Object | https://schema.org/MonetaryAmount or https://opensource.zalando.com/restful-api-guidelines/#173\n| Price Specification | https://schema.org/PriceSpecification -> https://schema.org/UnitPriceSpecification and https://schema.org/PaymentChargeSpecification\n-->\n\n### Standard Properties\n\nConfluent uses this set of standard properties to ensure common concepts use\nthe same name and semantics across different APIs.\n\n| Name             | Description                                                                                                                                                                                         |\n| ---------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **api_version**  | Many API objects have an `api_version` field indicating their API version. See the [Object Model](#object-model).                                                                           |\n| **kind**         | Many API objects have a `kind` field indicating the kind of object it is. See the [Object Model](#object-model).                                                                            |\n| **id**           | Many objects in the API will have an identifier, indicated via its `id` field, and should be treated as an opaque string unless otherwise specified. See the [Object Model](#object-model). |\n| **name**         | Objects which support a client-provided unique identifier instead of a generated `id` will indicate this identifier via its `name` field.                                                           |\n| **display_name** | The human-readable display name of an API object.                                                                                                                                                   |\n| **title**        | The official name of an API object, such as a company name. It should be treated as the formal version of `display_name`.                                                                           |\n| **description**  | One or more paragraphs of text description of an entity.                                                                                                                                            |\n| **created_at**   | The date and time the object was created, represented as a string in <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> format.                                            |\n| **updated_at**   | The date and time the object was last modified, represented as a string in <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> format.                                      |\n| **deleted_at**   | If present, the date and time after which the object was/will be deleted, represented as a string in <a href=\"https://www.ietf.org/rfc/rfc3339.txt\" target=\"_blank\">RFC 3339</a> format.            |\n| **page_token**   | The pagination token in the List request. See [Pagination](#pagination).                                                                                                                    |\n| **page_size**    | The pagination size in the List request. See [Pagination](#pagination).                                                                                                                     |\n| **total_size**   | The total count of items in the list irrespective of pagination. See [Pagination](#pagination).                                                                                             |\n| **spec**         | The _desired state_ specification of the resource, as observed by Confluent Cloud.                                                                                                                  |\n| **status**       | The _current state_ of the resource, as observed by Confluent Cloud.                                                                                                                                |\n\n# Versioning\n\nConfluent APIs ensure stability for your integrations by avoiding the introduction\nof breaking changes to customers unexpectedly. Confluent will make non-breaking\nAPI changes without advance notice. Thus, API clients **must** follow the\n[Compatibility Policy](#compatibility-policy) below to ensure your\nintegration remains stable. All APIs follow the API Lifecycle Policy described below,\nwhich describes the guarantees API clients can rely on.\n\nBreaking changes will be [widely communicated](#communication) in advance in accordance\nwith the Confluent [Deprecation Policy](#deprecation-policy). Confluent will provide\ntimelines and a migration path for all API changes, where available. Be sure to subscribe\nto one or more [communication channels](#communication) so you don't miss any updates!\n\nOne exception to these guidelines is for critical security issues. Confluent will take any necessary\nactions to mitigate any critical security issue as soon as possible, which may include disabling\nthe vulnerable functionality until a proper solution is available.\n\nDo not consume any Confluent API unless it is documented in the API Reference. All undocumented\nendpoints should be considered private, subject to change without notice, and not covered by any\nagreements.\n\n> Note: The version in the URL (e.g. \"v1\" or \"v2\") is not a \"major version\" in the\n> [Semantic Versioning](https://semver.org/) sense. It is a \"generational version\" or \"meta version\", as seen in\n> APIs like <a href=\"https://developer.github.com/v3/versions/\" target=\"_blank\">Github API</a> or the\n> <a href=\"https://stripe.com/docs/api/versioning\" target=\"_blank\">Stripe API</a>.\n\n## API Groups\n\nConfluent APIs are divided into API Groups, such as the Cluster Management for Apache Kafka (CMK) API group,\nthe Connect API group, and the Data Catalog API group. Each group has its own set of endpoints and resources,\nas well as its own API group version.\n\nBecause different API groups have different versions, there is no single version for the \"Confluent Cloud API\".\nThe latest version of the Connect API group may be `connect/v1`, while the latest version of the CMK API group\nmay be `cmk/v2`.\n\nWhen a breaking change is introduced into one API group, Confluent will increase the API version for that API group\nonly, leaving the other API groups' versions unchanged. This makes it easier for you to understand whether a given\nbreaking change impacts your usage of the APIs.\n\n## Known Issues\n\nDuring the Early Access and Preview periods, we have a few known issues.\n\n| Issue          | Description                                                                   | Proposed Resolution                                 |\n| -------------- | ----------------------------------------------------------------------------- | --------------------------------------------------- |\n| Quota Exceeded | Some \"Quota Exceeded\" errors will be returned as HTTP 400 instead of HTTP 402 | Return 402 consistently for \"Quota Exceeded\" errors |\n\n## API Lifecycle Policy\n\nThe following status labels are applicable to APIs, features, and SDK versions, based on\nthe current support status of each:\n\n- **Early Access** – May change at any time. Not recommended for production usage. Not officially supported by\n  Confluent. Intended for user feedback only. Users must be granted explicit access to the API by Confluent.\n- **Preview** – Unlikely to change between Preview and General Availability. Not recommended for production usage.\n  Officially supported by Confluent for non-production usage. Accessible to all users.\n- **Limited Availability (LA)** - Available to key select customers in a subset of regions/providers/networks and recommended for production usage.\n- **Generally Available (GA)** – Will not change at short notice. Recommended for production usage.\n  Officially supported by Confluent for non-production and production usage.\n- **Deprecated** – Still supported, but no longer under active development. Existing usage will continue to function\n  but migration following the upgrade guide is strongly recommended. New use cases should be built against the new\n  version. Deprecated feature or version will be removed in the future at the announced date.\n- **Sunset** – Removed, and no longer supported or available.\n\nAn API is \"Generally Available\" unless explicitly marked otherwise.\n\n## Compatibility Policy\n\nConfluent Cloud APIs are governed by\n<a href=\"https://docs.confluent.io/cloud/current/clusters/upgrade-policy.html\" target=\"_blank\">\nConfluent Cloud Upgrade Policy</a>, which means that backward incompatible changes and\ndeprecations will be made approximately once per year, and 180 days notice will be provided via email to all\nregistered Confluent Cloud users.\n\n### Backward Compatibility\n\n> _An API version is backward compatible if a program written against the previous version of the API will continue to work the same way, without modification, against this version of the API._\n\nConfluent considers the following changes to be backward compatible:\n\n- Adding new API resources.\n- Adding new optional parameters to existing API requests (e.g., query string).\n- Adding new properties to existing API resources (e.g., request body).\n- Changing the order of properties in existing API responses.\n- Changing the length or format of object IDs or other opaque strings.\n  - Unless otherwise documented, you can safely assume object IDs generated by Confluent will never exceed 255\n    characters, but you should be able to handle IDs of up to that length. If you're using MySQL,\n    for example, you should store IDs in a `VARCHAR(255) COLLATE utf8_bin` column.\n  - This includes adding or removing fixed prefixes (such as `lkc-` on Kafka cluster IDs).\n  - This includes API keys, API tokens, and similar authentication mechanisms.\n  - This includes all strings described as \"opaque\" in the docs, such as pagination cursors.\n- Adding new API event types.\n- Adding new properties to existing API event types.\n- Omitting properties with null values from existing API responses.\n\n### Forward Compatibility\n\n> _An API version is forward compatible if a program written against the next version of the API\n> will continue to work the same way, without modification, against this version of the API._\n\nIn other words, a forward compatible API will accept input intended for a later version of itself.\n\nConfluent does not guarantee the forward compatibility of the APIs, but Confluent does generally follow the guidelines\ngiven by the [Robustness principle](https://en.wikipedia.org/wiki/Robustness_principle).\nThis means that the API determines what to do with a request based only on the parts that it recognizes.\n\nThis is often referred to as the MUST IGNORE rule.\n\n- Request parameters that are not recognized will be ignored (e.g., query string).\n- Request properties that are not recognized will be ignored (e.g., request body).\n- Request metadata that are not recognized will be ignored (e.g., request headers).\n\nAPI clients must also follow the MUST IGNORE rule.\n\n- Response properties that are not recognized must be ignored (e.g., response body).\n- Response metadata that are not recognized must be ignored (e.g., response headers).\n\nAdditionally, there is a more subtle related rule called the MUST FORWARD rule. Any parts of\na request that an API doesn't recognize must be forwarded unchanged.\n\n- Response properties that are not recognized must be included in any input subsequent updates (e.g., request body)\n  - This includes future `PUT` requests in a read/modify/write operation.\n    (This isn't required for `PATCH` partial updates, which is why Confluent APIs use `PATCH`.)\n- Event processors must not strip unknown properties before forwarding messages.\n\n#### Compatibility Implementation Hints\n\nConfluent considers adding new properties to existing API resources (e.g., response bodies) to be a backward-compatible change. To ensure your integrations remain stable when new fields are introduced, your JSON parsers should be configured to ignore unknown properties rather than throwing an error.\n\nFor the **Jackson** library (Java), use one of these approaches:\n\n**1. Global Configuration (Recommended)**\n\nConfigure `ObjectMapper` to ignore unknown properties globally.\n\n```java\nObjectMapper objectMapper = new ObjectMapper();\nobjectMapper.configure(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES, false);\n```\n\n**2. Class-Level Control**\n\nUse `@JsonIgnoreProperties` to ignore unknown fields on specific classes.\n\n```java\n@JsonIgnoreProperties(ignoreUnknown = true)\npublic class MyResource { ... }\n```\n\n**3. Capturing Unknown Fields**\n\nUse `@JsonAnySetter` to preserve unknown fields in a `Map`, in order to use them on future requests to fulfill the MUST FORWARD requirement.\n\n```java\npublic class MyResource {\n    // ... existing fields ...\n    private Map<String, Object> unknownProperties = new HashMap<>();\n\n    @JsonAnySetter\n    public void addUnknownProperty(String key, Object value) {\n        this.unknownProperties.put(key, value);\n    }\n    \n    public Map<String, Object> getUnknownProperties() {\n        return unknownProperties;\n    }\n}\n```\n\n### Client Responsibilities\n\n- Resource and rate limits, and the default and maximum sizes of paginated data **are not**\n  considered part of the API contract and may change (possibly dynamically). It is the client's\n  responsibility to read the road signs and obey the speed limit.\n- If a property has a primitive type and the API documentation does not explicitly limit its\n  possible values, clients **must not** assume the values are constrained to a particular set\n  of possible responses.\n- If a property of an object is not explicitly declared as mandatory in the API, clients\n  **must not** assume it will be present.\n- A resource **may** be modified to return a \"redirection\" response (e.g. `301`, `307`) instead of\n  directly returning the resource. Clients **must** handle HTTP-level redirects, and respect HTTP\n  headers (e.g. `Location`).\n\n## Deprecation Policy\n\nConfluent will announce deprecations at least 180 days in advance of a breaking change\nand will continue to maintain the deprecated APIs in their original form during this time.\n\nExceptions to this policy apply in case of critical security vulnerabilities or functional defects.\n\n### Communication\n\nWhen a deprecation is announced, the details and any relevant migration\ninformation will be available on one or more of the following channels:\n\n- Announcements on the <a href=\"https://www.confluent.io/blog/\" target=\"_blank\">Developer Blog</a>,\n  <a href=\"https://confluentcommunity.slack.com\" target=\"_blank\">Community Slack</a>\n  (<a href=\"https://slackpass.io/confluentcommunity\" target=\"_blank\">join!</a>),\n  <a href=\"https://groups.google.com/forum/#!forum/confluent-platform\" target=\"_blank\">Google Group</a>,\n  the <a href=\"https://twitter.com/ConfluentInc\" target=\"_blank\">@ConfluentInc twitter</a>\n  account, and similar channels\n- Enterprise customers may receive information by email to their specified Confluent contact, if applicable.\n\n<!-- TODO:\n### Discoverability\n-->\n\n# HTTP Guidelines\n\n## Status Codes\n\nConfluent respects the meanings and behavior of HTTP status codes as defined\nin <a href=\"https://tools.ietf.org/html/rfc2616\">RFC2616</a> and elsewhere.\n\n- Codes in the `2xx` range indicate success\n- Codes in the `3xx` range indicate redirection\n- Codes in the `4xx` range indicate an error caused by the client request\n  (e.g., a required parameter was omitted, an invalid cluster configuration was provided, etc.)\n- Codes in the `5xx` range indicate an error with Confluent's servers (these are rare)\n\nThe various HTTP status codes that might be returned are listed below.\n\n| Code               | Title             | Description                                                                                                     |\n| ------------------ | ----------------- | --------------------------------------------------------------------------------------------------------------- |\n| 200                | OK                | Everything worked as expected.                                                                                  |\n| 201                | Created           | The resource was created. Follow the `Location` header.                                                         |\n| 204                | No Content        | Everything worked and there is no content to return.                                                            |\n| 400                | Bad Request       | The request was unacceptable, often due to malformed syntax, or a missing or malformed parameter.               |\n| 401                | Unauthorized      | No valid credentials provided. or the credentials are unsuitable, invalid, or unauthorized.                     |\n| 402                | Over Quota        | The request was valid, but you've exceeded your plan quota or limits.                                           |\n| 404                | Not Found         | The requested resource doesn't exist or you're unauthorized to know it exists.                                  |\n| 409                | Conflict          | The request conflicts with another request (perhaps it already exists or was based on a stale version of data). |\n| 422                | Validation Failed | The request was parsed correctly but failed some sort of validation.                                            |\n| 429                | Too Many Requests | Too many requests hit the API too quickly. Confluent recommends an exponential backoff of your requests.        |\n| 500, 502, 503, 504 | Server Errors     | Something went wrong on Confluent's end. (These are rare.)                                                      |\n\nThis list is not exhaustive; other standard HTTP error codes may be used,\nincluding `304`, `307`, `308`, `405`, `406`, `408`, `410`, and `415`.\n\nFor more details, see https://httpstatuses.com.\n\n<!--\n\n## Method Overriding\n\nSome firewalls and HTTP clients restrict the use of verbs other than `GET` and `POST`. In those\nenvironments, Confluent API operations that require `PUT`, `PATCH`, and `DELETE` verbs will be inaccessible.\n\nTo avoid this issue, Confluent APIs support the `X-HTTP-Method-Override` header, allowing clients to\n\"tunnel\" `PUT`, `PATCH`, and `DELETE` requests via a `POST` request.\n\nFor example, to call a Confluent `PATCH` resource via a `POST` request, you can\ninclude `X-HTTP-Method-Override: PATCH` as a header.\n\n## User Agent Required\n\nConfluent API requests **should** include a valid `User-Agent` header. Requests with no `User-Agent`\nheader may be rejected. You should use the name of your integration for the `User-Agent`\nheader value and include contact information so that Confluent can contact you if there are problems.\n\n> If your integration is acting as a proxy or gateway, you **should** forward the User-Agent\n> of the originating client with your API requests.\n\nHere's a complete example:\n\n    User-Agent: CoolToolName/1.2.3 (https://example.org/CoolTool/; CoolTool@example.org) UsedBaseLibrary/2.1.0\n\nThe minimum user agent string is the integration name and version: `name/version`.\nYou can string together multiple values in a space-separated list. The full syntax is:\n\n    name/version [(comments)] [name/version [(comments)]] [...]​\n\nFor the integration name, use a string (without whitespace) that clearly and meaningfully\nidentifies your integration.\n\n* Avoid ambiguous names: `Confluent-Integration`, `Kafka-Sink`\n* Use clear and meaningful names: `ABCTools-ToolName`, `StackStorm-Confluent-Plugin`\n\nFor the version, use a semantic version, build ID, commit hash, or other identifier\nthat is updated automatically when you release a new version.\n\nWrap comments in parentheses `()` as a semi-colon separated list. Helpful comments to include:\n\n* A public URL for your integration, such as a GitHub link or a page in your\n  docs site that describes the integration.\n* Contact information so that Confluent can easily reach the integration publisher. This\n  information from the user agent string will never be shared nor used by Confluent for\n  any purpose other than discussing the integration with its publisher.\n\nIf you provide an invalid `User-Agent` header, you may receive a `403 Forbidden` response.\n\n-->\n\n# Metrics APIs\n\nFor Metrics APIs, see <a href=\"https://api.telemetry.confluent.cloud/docs\">Confluent Cloud Metrics API</a>.\n"
servers:
- url: https://api.confluent.cloud
  description: Confluent Cloud API
tags:
- name: Statements (query/v1alpha1)
  description: 'Execute SQL statements against queryable topics and read their results. A statement

    that resolves quickly returns its results inline; a long-running one is assigned a

    background job that can be polled for status.'
paths:
  /query/v1alpha1:
    servers:
    - url: https://sql.region.provider.confluent.cloud
      description: SQL Endpoint through Analytics Gateway
    x-lifecycle-stage: Early Access
    post:
      summary: Execute SQL Statement
      description: 'Executes an arbitrary SQL query against the engine. If the query resolves in under 30 seconds and returns less than 25 MiB, the response will be an inline HTTP 200 OK.  Otherwise, a 202 Accepted response redirects the client to retrieve  results from a separate streamed data location. Rows are returned as JSON strings by default; set `options.result_format` to `ARROW_STREAM` to receive a base64-encoded Arrow IPC stream with native column types instead.

        '
      operationId: executeQueryV1alpha1Statement
      x-lifecycle-stage: Early Access
      tags:
      - Statements (query/v1alpha1)
      security:
      - resource-api-key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/query.v1alpha1.QueryRequest'
            examples:
              show_tables:
                summary: List the tables in a cluster
                description: 'Metadata is discovered with `SHOW TABLES` and `DESCRIBE`. Both return the same result envelope as `SELECT`.

                  '
                value:
                  catalog_name: env-xyz123
                  database_name: lkc-xyz123
                  query: SHOW TABLES
              describe_table:
                summary: Describe a table's columns
                description: 'Returns one row per column. The values in the `type` column are the CLI/UI rendering of the Flink type — `BYTES`, `STRING`, `ROW<...>` — which is a different rendering of the same type system that `schema.columns[].type` describes as JSON.

                  '
                value:
                  catalog_name: env-xyz123
                  database_name: lkc-xyz123
                  query: DESCRIBE orders
              select_with_limit:
                summary: SELECT with LIMIT
                description: 'Omitting `options.result_format` defaults to `JSON`, returning rows as arrays of JSON strings.

                  '
                value:
                  catalog_name: env-xyz123
                  database_name: lkc-xyz123
                  query: SELECT l_orderkey, l_quantity, l_description FROM "order" LIMIT 5
              select_with_limit_arrow:
                summary: SELECT with LIMIT (Arrow result format)
                description: 'Requests the same rows as a base64-encoded Arrow IPC stream, preserving native column types instead of stringifying them.

                  '
                value:
                  catalog_name: env-xyz123
                  database_name: lkc-xyz123
                  options:
                    result_format: ARROW_STREAM
                  query: SELECT l_orderkey, l_quantity, l_description FROM "order" LIMIT 5
      responses:
        '200':
          description: 'Successful synchronous response containing fully inlined metadata and data results.

            '
          headers:
            X-Request-Id:
              description: Unique identifier for this request, useful for support and debugging
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/query.v1alpha1.QueryResponseInline'
              examples:
                select_with_limit:
                  summary: Inline Query Execution Result
                  value:
                    api_version: query/v1alpha1
                    kind: Statement
                    result:
                      result_format: JSON
                      schema:
                        columns:
                        - name: L_ORDERKEY
                          type:
                            type:
                            - BIGINT
                            - 'null'
                        - name: L_QUANTITY
                          type:
                            type:
                            - FLOAT
                            - 'null'
                      data:
                      - - '1'
                        - '17.45'
                select_nested:
                  summary: Inline Query Execution Result (complex columns)
                  description: '`ROW`, `ARRAY`, `MAP` and `MULTISET` columns describe their structure in `schema` and carry their values as nested JSON arrays. Values are positional at every level: names appear only in the schema. The second row shows a SQL NULL `ARRAY` and an empty `MAP`.

                    '
                  value:
                    api_version: query/v1alpha1
                    kind: Statement
                    result:
                      result_format: JSON
                      schema:
                        columns:
                        - name: PK
                          type:
                            type: BIGINT
                        - name: user
                          type:
                            type: ROW
                            fields:
                            - name: USER_ID
                              fieldType:
                                type: VARCHAR
                                length: 2147483647
                            - name: AGE
                              fieldType:
                                type: INTEGER
                        - name: tags
                          type:
                            type:
                            - ARRAY
                            - 'null'
                            elementType:
                              type:
                              - VARCHAR
                              - 'null'
                              length: 2147483647
                        - name: scores
                          type:
                            type:
                            - MAP
                            - 'null'
                            keyType:
                              type: VARCHAR
                              length: 2147483647
                            valueType:
                              type:
                              - INTEGER
                              - 'null'
                      data:
                      - - '912'
                        - - perspiciatis
                          - '49'
                        - - pro
                          - null
                        - - - latency
                            - '42'
                      - - '27994'
                        - - suscipit
                          - '25'
                        - null
                        - []
                describe_table:
                  summary: Inline Query Execution Result (DESCRIBE)
                  description: '`SHOW` and `DESCRIBE` use the same envelope as `SELECT`, with declared column types and every value encoded as a string. Note `"TRUE"` for the `null` column, which is declared `BOOLEAN`.

                    '
                  value:
                    api_version: query/v1alpha1
                    kind: Statement
                    result:
                      result_format: JSON
                      schema:
                        columns:
                        - name: name
                          type:
                            type:
                            - VARCHAR
                            - 'null'
                            length: 2147483647
                        - name: type
                          type:
                            type:
                            - VARCHAR
                            - 'null'
                            length: 2147483647
                        - name: 'null'
                          type:
                            type: BOOLEAN
                        - name: key
                          type:
                            type:
                            - VARCHAR
                            - 'null'
                            length: 2147483647
                        - name: extras
                          type:
                            type:
                            - VARCHAR
                            - 'null'
                            length: 2147483647
                        - name: watermark
                          type:
                            type:
                            - VARCHAR
                            - 'null'
                            length: 2147483647
                      data:
                      - - KEY
                        - BYTES
                        - 'TRUE'
                        - null
                        - null
                        - null
                      - - PK
                        - BIGINT
                        - 'FALSE'
                        - null
                        - null
                        - null
                      - - user
                        - ROW<`USER_ID` STRING, `AGE` INT>
                        - 'FALSE'
                        - null
                        - null
                        - null
                select_with_limit_arrow:
                  summary: Inline Query Execution Result (Arrow)
                  description: 'Returned when the statement requested `result_format: ARROW_STREAM`. Rows are carried as a base64-encoded Arrow IPC stream with native column types; `schema` still describes the columns so clients can inspect the result without decoding the payload.

                    '
                  value:
                    api_version: query/v1alpha1
                    kind: Statement
                    result:
                      result_format: ARROW_STREAM
                      schema:
                        columns:
                        - name: L_ORDERKEY
                          type:
                            type:
                            - BIGINT
                            - 'null'
                        - name: L_QUANTITY
                          type:
                            type:
                            - FLOAT
                            - 'null'
                      data: /////0FSUk9XLUlQQy1TVFJFQU0tUExBQ0VIT0xERVItQllURVM=
        '202':
          description: 'Asynchronous request registration. Returned when data sets exceed 25 MiB or execution times cross the 30s processing barrier.

            '
          headers:
            X-Request-Id:
              description: Unique identifier for this request, useful for support and debugging
              schema:
                type: string
            Location:
              description: Complete URL path indicating where the client can poll for state changes.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/query.v1alpha1.QueryResponseAsync'
              examples:
                async_redirect:
                  summary: Async Job Reference Output
                  value:
                    statement_id: statement_1b2c3d4e5f6a
                    result_url: https://sql.region.provider.confluent.cloud/query/v1alpha1/jobs/statement_1b2c3d4e5f6a/results
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
  /query/v1alpha1/jobs/{statement_id}/status:
    servers:
    - url: https://sql.region.provider.confluent.cloud
      description: SQL Endpoint through Analytics Gateway
    x-lifecycle-stage: Early Access
    get:
      summary: Query Async Job Status
      description: Returns status updates containing the explicit operational lifecycle states of an active background query.
      operationId: getQueryV1alpha1JobStatus
      x-lifecycle-stage: Early Access
      tags:
      - Statements (query/v1alpha1)
      security:
      - resource-api-key: []
      parameters:
      - name: statement_id
        in: path
        required: true
        description: The target unique identifier of the background operational query process.
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: State evaluated successfully.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/query.v1alpha1.JobStatusResponse'
              examples:
                job_running:
                  summary: Statement still running
                  value:
                    status:
                      phase: RUNNING
                job_completed:
                  summary: Statement completed successfully
                  value:
                    status:
                      phase: COMPLETED
                job_failed:
                  summary: Statement failed
                  value:
                    status:
                      phase: FAILED
                    errors:
                    - id: ed42afdc-f0d5-4c0d-b428-9fc6ed6e279d
                      status: '200'
                      code: FE_STATEMENT_FAILED
                      title: Statement Failed
                      detail: The statement exceeded the maximum execution time.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
components:
  schemas:
    query.v1alpha1.QueryResponseInline:
      type: object
      description: Response structure returned directly for fast inline extractions.
      required:
      - api_version
      - kind
      - result
      properties:
        api_version:
          type: string
          x-extensible-enum:
          - query/v1alpha1
          readOnly: true
          description: APIVersion defines the schema version of this representation of a resource.
        kind:
          type: string
          x-extensible-enum:
          - Statement
          readOnly: true
          description: Kind defines the object this REST resource represents.
        result:
          description: The schema and data produced by the statement.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.QueryResult'
    query.v1alpha1.RowFieldType:
      type: object
      required:
      - name
      - fieldType
      description: 'One field of a `ROW`. Field names are carried here, in the schema only — never inline with the row values.

        '
      properties:
        name:
          type: string
          description: The name of the field.
        fieldType:
          description: The data type of the field.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.DataType'
        description:
          type: string
          description: Optional field comment from the type declaration.
    query.v1alpha1.DataType:
      type: object
      required:
      - type
      - nullable
      description: 'Flink logical type descriptor, mirroring `DataType` in the Flink Gateway API.

        Complex types nest recursively: `elementType`, `keyType`, `valueType` and

        `fields[].fieldType` are themselves `DataType` objects, so `ROW`, `ARRAY`,

        `MAP` and `MULTISET` nest to arbitrary depth.


        The value of `type` determines which parameter properties are present; all

        others are absent.


        | `type` | Parameters |

        | --- | --- |

        | `BOOLEAN`, `TINYINT`, `SMALLINT`, `INTEGER`, `BIGINT`, `FLOAT`, `DOUBLE`, `DATE`, `NULL` | none |

        | `CHAR`, `VARCHAR`, `BINARY`, `VARBINARY` | `length` |

        | `DECIMAL` | `precision`, `scale` |

        | `TIME_WITHOUT_TIME_ZONE`, `TIMESTAMP_WITHOUT_TIME_ZONE`, `TIMESTAMP_WITH_TIME_ZONE` | `precision` |

        | `INTERVAL_YEAR_MONTH` | `precision`, `resolution` |

        | `INTERVAL_DAY_TIME` | `precision`, `fractionalPrecision`, `resolution` |

        | `ARRAY`, `MULTISET` | `elementType` |

        | `MAP` | `keyType`, `valueType` |

        | `ROW` | `fields` |

        '
      properties:
        type:
          type: string
          description: The Flink logical type name of the column or field.
        nullable:
          type: boolean
          description: Whether values of this column or field can be null.
        length:
          type: integer
          format: int32
          description: 'Declared length of `CHAR`, `VARCHAR`, `BINARY` and `VARBINARY`. Unbounded `VARCHAR` and `VARBINARY` report 2147483647.

            '
        precision:
          type: integer
          format: int32
          description: 'Declared precision of `DECIMAL`, the `TIME`/`TIMESTAMP` types and the `INTERVAL_*` types.

            '
        scale:
          type: integer
          format: int32
          description: Declared scale of `DECIMAL`.
        keyType:
          description: Key type of a `MAP`.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.DataType'
        valueType:
          description: Value type of a `MAP`.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.DataType'
        elementType:
          description: Element type of an `ARRAY` or `MULTISET`.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.DataType'
        fields:
          type: array
          description: Fields of a `ROW`, in declaration order.
          items:
            $ref: '#/components/schemas/query.v1alpha1.RowFieldType'
        resolution:
          type: string
          description: 'Interval resolution, for example `YEAR_TO_MONTH` for `INTERVAL_YEAR_MONTH` or `DAY_TO_SECOND` for `INTERVAL_DAY_TIME`.

            '
        fractionalPrecision:
          type: integer
          format: int32
          description: Fractional-second precision of `INTERVAL_DAY_TIME`.
        class_name:
          type: string
          description: 'Class name of a structured type. Present in the Flink type model; the engine does not currently emit structured types.

            '
    query.v1alpha1.QueryOptions:
      type: object
      description: 'Settings that tune how this query is handled. Omitted fields fall back to service defaults.

        '
      properties:
        max_result_rows:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          description: Maximum rows to return up to configured limit.
        result_format:
          type: string
          x-extensible-enum:
          - JSON
          - ARROW_STREAM
          default: JSON
          description: 'Encoding for the returned rows, echoed back as `result.result_format`. `JSON` returns `result.data` as an array of rows, requiring clients to coerce values using `result.schema`. `ARROW_STREAM` returns `result.data` as a base64-encoded Arrow IPC stream, preserving native column types. Inline `ARROW_STREAM` payloads are size-capped; larger results are delivered through the asynchronous 202 flow.

            '
    query.v1alpha1.JobStatusResponse:
      type: object
      description: Lifecycle state of a statement running in the background.
      required:
      - status
      properties:
        status:
          description: The status of the background statement.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.JobStatus'
        errors:
          type: array
          description: 'Failure details for the background statement. Populated only when `status.phase` is `FAILED`; omitted otherwise.

            '
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Error'
    query.v1alpha1.QueryRequest:
      type: object
      required:
      - catalog_name
      - database_name
      - query
      description: Request parameters for query analysis and extraction.
      properties:
        catalog_name:
          type: string
          description: Confluent Cloud environment ID (e.g., env-xyz123)
        database_name:
          type: string
          description: Kafka cluster ID (e.g., lkc-xyz123)
        options:
          description: Options for this query.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.QueryOptions'
        query:
          type: string
          description: SQL query to execute
        client_info:
          type: object
          additionalProperties:
            type: string
          description: 'Free-form client metadata for telemetry and debugging (e.g., client_name, client_version, driver_version). Values are strings; not interpreted by the server.

            '
    query.v1alpha1.ResultValue:
      description: "One value within a `JSON` result row.\n\nScalar values are JSON strings encoded according to the declaring column's\n`DataType.type`. JSON `null` is SQL NULL, at any depth.\n\nComplex values are JSON arrays whose elements are themselves `ResultValue`s:\n\n- `ROW` — a positional array with one element per entry of the type's `fields`,\n  in the same order. Field names are never repeated inline; recovering them\n  requires the schema.\n- `ARRAY` — one element per collection element, in order.\n- `MAP` and `MULTISET` — an array of two-element `[key, value]` arrays.\n\nA complex value that is itself SQL NULL is JSON `null`, which is distinct from\nan array whose elements are null.\n\nCanonical scalar encodings:\n\n| `DataType.type` | Encoding |\n| --- | --- |\n| `NULL` | JSON `null` |\n| `BOOLEAN` | `\"TRUE\"` or `\"FALSE\"`, upper case |\n| `TINYINT`, `SMALLINT`, `INTEGER`, `BIGINT` | base-10 integer string, optional leading `-` |\n| `FLOAT`, `DOUBLE` | shortest round-trip decimal string, in exponent notation where Java would use it |\n| `DECIMAL` | plain decimal string with exactly `scale` fractional digits, no exponent |\n| `CHAR`, `VARCHAR` | the string value verbatim, UTF-8 |\n| `BINARY`, `VARBINARY` | hexadecimal literal, for example `\"x'7f0203'\"` |\n| `DATE` | `YYYY-MM-DD` |\n| `TIME_WITHOUT_TIME_ZONE` | `HH:MM:SS[.fff]` |\n| `TIMESTAMP_WITHOUT_TIME_ZONE` | `YYYY-MM-DD HH:MM:SS[.fff]`, space separated |\n| `TIMESTAMP_WITH_TIME_ZONE` | `YYYY-MM-DD HH:MM:SS[.fff]`, rendered in UTC. Flink's `TIMESTAMP_LTZ` is reported under this name; the instant is stored as UTC and the zone is metadata only, so no offset is emitted |\n| `INTERVAL_YEAR_MONTH` | `+YYYY-MM` |\n| `INTERVAL_DAY_TIME` | `+D HH:MM:SS.fff` |\n\nThese render SQL values, not API datetime or numeric fields — each format follows\nthe column's declared SQL type and matches Confluent Flink's documented value\nencodings, so one decoder serves both surfaces. `TIMESTAMP` therefore uses a space\nseparator rather than RFC 3339's `T`.\n\nThese encodings apply only when `result_format` is `JSON`. Under\n`ARROW_STREAM` values are carried natively, with `ROW` mapping to an Arrow\nstruct, `ARRAY` and `MULTISET` to a list, and `MAP` to a map.\n"
      anyOf:
      - type:
        - string
        - 'null'
      - type:
        - array
        - 'null'
        items:
          $ref: '#/components/schemas/query.v1alpha1.ResultValue'
    query.v1alpha1.ColumnDetails:
      type: object
      description: A column in the result schema.
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: The name of the SQL result column.
        type:
          description: The logical type of the column.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.DataType'
    query.v1alpha1.ResultRow:
      type: array
      description: 'A single result row — column values ordered to match `schema.columns`. Rows carry no changelog operation marker: this API returns a point-in-time snapshot rather than a changelog stream, so there are no retractions to express.

        '
      items:
        $ref: '#/components/schemas/query.v1alpha1.ResultValue'
    query.v1alpha1.QueryResponseAsync:
      type: object
      description: Reference pointers issued when standard executions run asynchronously.
      required:
      - statement_id
      - result_url
      properties:
        statement_id:
          type: string
          maxLength: 255
          description: Unique identifier generated to trace the decoupled tracking process.
        result_url:
          type: string
          format: uri
          description: The streaming data target location where finished row sets can be downloaded.
    Error:
      type: object
      description: Describes a particular error encountered while performing an operation.
      properties:
        id:
          description: A unique identifier for this particular occurrence of the problem.
          type: string
          maxLength: 255
        status:
          description: The HTTP status code applicable to this problem, expressed as a string value.
          type: string
        code:
          description: An application-specific error code, expressed as a string value.
          type: string
        title:
          description: A short, human-readable summary of the problem. It **SHOULD NOT** change from occurrence to occurrence of the problem, except for purposes of localization.
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
        source:
          type: object
          description: If this error was caused by a particular part of the API request, the source will point to the query string parameter or request body property that caused it.
          properties:
            pointer:
              description: A JSON Pointer [RFC6901] to the associated entity in the request document [e.g. "/spec" for a spec object, or "/spec/title" for a specific field].
              type: string
            parameter:
              description: A string indicating which query parameter caused the error.
              type: string
        error_code:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    query.v1alpha1.JobStatus:
      type: object
      description: The status of the background statement.
      required:
      - phase
      properties:
        phase:
          type: string
          x-extensible-enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
          description: 'The lifecycle phase of the background statement:


            PENDING: statement is queued and has not started executing;


            RUNNING: statement execution is in progress;


            COMPLETED: statement finished successfully and its results are retrievable;


            FAILED: statement execution failed; see `errors` for details.

            '
          example: RUNNING
          readOnly: true
    Failure:
      type: object
      description: Provides information about problems encountered while performing an operation.
      required:
      - errors
      properties:
        errors:
          description: List of errors which caused this operation to fail
          type: array
          items:
            $ref: '#/components/schemas/Error'
          uniqueItems: true
    query.v1alpha1.ResultSchema:
      type: object
      description: The table columns of the result schema.
      required:
      - columns
      properties:
        columns:
          type: array
          description: 'Column definitions in result order, matching the order of values within each row.

            '
          items:
            $ref: '#/components/schemas/query.v1alpha1.ColumnDetails'
    query.v1alpha1.QueryResult:
      type: object
      description: 'Query result containing schema metadata and row data.


        This envelope is the same for every statement kind. `SHOW` and `DESCRIBE` return declared column types in `schema` and string-encoded values in `data` exactly as `SELECT` does, so a client needs only one result reader and never has to branch on the statement it sent.

        '
      required:
      - result_format
      - schema
      - data
      properties:
        result_format:
          type: string
          x-extensible-enum:
          - JSON
          - ARROW_STREAM
          readOnly: true
          description: 'Encoding of `data`, echoing the `options.result_format` requested on the statement.

            '
        schema:
          description: Column metadata describing the shape of the returned rows.
          allOf:
          - $ref: '#/components/schemas/query.v1alpha1.ResultSchema'
        data:
          description: 'Result rows in the encoding named by `result_format`: an array of rows for `JSON`, where each row is a positional array of column values ordered to match `schema.columns`; or a base64-encoded Arrow IPC stream for `ARROW_STREAM`, carrying native column types rather than stringified values. Inline Arrow payloads are size-capped by the service; larger results are delivered through the asynchronous 202 flow.


            Under `JSON`, individual values — including those of complex `ROW`, `ARRAY`, `MAP` and `MULTISET` columns — are encoded as described by `ResultValue`.

            '
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/query.v1alpha1.ResultRow'
          - type: string
            format: byte
  responses:
    BadRequestError:
      description: Bad Request
      headers:
        X-Request-Id:
          schema:
            type: string
          description: The unique identifier for the API request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            errors:
            - id: ed42afdc-f0d5-4c0d-b428-9fc6ed6e279d
              status: '400'
              code: invalid_filter
              title: Invalid Filter
              detail: The 'delorean' resource can't be filtered by 'num_doors'
              source:
                parameter: num_doors
    RateLimitError:
      description: Rate Limit Exceeded
      headers:
        X-Request-Id:
          schema:
            type: string
          description: The unique identifier for the API request.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The maximum number of requests you're permitted to make per time period.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: The number of requests remaining in the current rate limit window.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: "The relative time in seconds until the current rate-limit window resets.  \n  \n**Important:** This differs from Github and Twitter's same-named header which uses UTC epoch seconds. We use relative time to avoid client/server time synchronization issues."
        Retry-After:
          schema:
            type: integer
          description: The number of seconds to wait until the rate limit window resets. Only sent when the rate limit is reached.
    UnauthenticatedError:
      x-summary: Unauthorized
      description: The request lacks valid authentication credentials for this resource.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: The unique identifier for the API request.
        WWW-Authenticate:
          schema:
            type: string
          description: The unique identifier for the API request.
          example: Basic error="invalid_key", error_description="The API Key is invalid"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            errors:
            - id: ed42afdc-f0d5-4c0d-b428-9fc6ed6e279d
              status: '401'
              code: user_unauthenticated
              title: Authentication Required
              detail: Valid authentication credentials must be provided
    NotFoundError:
      description: Not Found
      headers:
        X-Request-Id:
          schema:
            type: string
          description: The unique identifier for the API request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            errors:
            - id: ed42afdc-f0d5-4c0d-b428-9fc6ed6e279d
              status: '404'
              title: Not Found
    UnauthorizedError:
      x-summary: Forbidden
      description: The access credentials were considered insufficient to grant access
      headers:
        X-Request-Id:
          schema:
            type: string
          description: The unique identifier for the API request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            errors:
            - id: ed42afdc-f0d5-4c0d-b428-9fc6ed6e279d
              status: '403'
              code: user_unauthorized
              title: User Access Unauthorized
              detail: The user 'mcfly' is not allowed to access the 'delorean' resource without the 'plutonium' role.
    DefaultSystemError:
      description: Oops, something went wrong!
      headers:
        X-Request-Id:
          schema:
            type: string
          description: The unique identifier for the API request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            errors:
            - id: ed42afdc-f0d5-4c0d-b428-9fc6ed6e279d
              status: '500'
              code: out_of_gas
              title: DeLorean Out Of Gas
              detail: The DeLorean has run out of gas, but Doc Brown will fill 'er up for you asap
  securitySchemes:
    cloud-api-key:
      type: http
      scheme: basic
      description: Authenticate with Cloud API Keys using HTTP Basic Auth. Treat the Cloud API Key ID as the username and Cloud API Key Secret as the password.
    confluent-sts-access-token:
      type: oauth2
      description: Authenticate with Confluent API using this credentials (JSON Web Tokens) following OAuth 2.0.
      flows:
        clientCredentials:
          tokenUrl: https://api.confluent.cloud/sts/v1/oauth2/token
          scopes: {}
    global-api-key:
      type: http
      scheme: basic
      description: Authenticate with Global API Keys using HTTP Basic Auth. Treat the Global API Key ID as the username and Global API Key Secret as the password.
    resource-api-key:
      type: http
      scheme: basic
      description: Authenticate with resource-specific API Keys using HTTP Basic Auth. Treat the resource-specific API Key ID as the username and resource-specific API Key Secret as the password.
    external-access-token:
      type: oauth2
      description: Authenticate with Confluent API using this credentials (JSON Web Tokens) following OAuth 2.0.
      flows:
        clientCredentials:
          tokenUrl: https://api.confluent.cloud/sts/v1/oauth2/token
          scopes: {}
    oauth:
      type: oauth2
      description: Authenticate with OAuth 2.0. Currently this is only supported for partner APIs.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            partner:alter: enables partners to alter entitlements
            partner:create: enables partners to create entitlements and signup on behalf of customers
            partner:delete: enables partners to delete entitlements and organizations
            partner:describe: enables partners to read and list entitlements and organizations
