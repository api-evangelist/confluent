source: >-
  mcp/confluent-mcp.yml (tool names transcribed from
  https://docs.confluent.io/cloud/current/ai/ai-tools/managed-mcp-server.html)
  bound to operationIds in openapi/confluent-cloud-openapi.yaml and
  openapi/confluent-metrics-api-openapi.yaml
description: >-
  Binds each Confluent managed MCP tool to the REST operation(s) that back it, so a tool
  inherits a real inputSchema from the spec instead of a guessed one. The live tools/list is
  auth-gated (HTTP 401), so bindings are by name and documented semantics against the published
  tool tables — confidence is set accordingly and nothing is asserted that the spec does not
  contain. Confluent's own docs describe the managed servers as views onto the Cloud APIs, and
  every binding below resolves to an operation that exists in the harvested spec.
surfaces:
  openapi:
    - file: openapi/confluent-cloud-openapi.yaml
      title: Confluent Cloud APIs
      operations: 504
      gated: false
      source: https://docs.confluent.io/cloud/current/openapi.yaml
    - file: openapi/confluent-metrics-api-openapi.yaml
      title: Confluent Cloud Metrics API
      operations: 6
      gated: false
      source: https://api.telemetry.confluent.cloud/docs/api.yaml
  graphql: null
  mcp:
    global: https://api.confluent.cloud/mcp/v1
    regional: https://mcp.<region>.<cloud>.confluent.cloud/mcp/v1/organizations/<org_id>
    gated: true
    gate_evidence: 'POST tools/list -> HTTP 401 Unauthorized'
