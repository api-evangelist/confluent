mcp_only:
  - tool: get_connector_logs
    reason: >-
      No connector-log operation exists anywhere in the harvested Cloud API spec. Confluent
      surfaces recent connector logs (ERROR by default, 72-hour lookback) through MCP only.
  - tool: get_connector_error_summary
    reason: >-
      AI-generated summary of connector errors. A server-side synthesis over task status and
      error traces, with no REST equivalent.
  - tool: get_connector_fix_recommendations
    reason: >-
      AI-generated fix recommendations for a failing connector. Server-side inference, no REST
      equivalent. This and the two rows above are the clearest case in the catalog of an MCP
      surface that is not a projection of the REST API but a distinct product capability.
  - tool: consume_kafka_messages
    reason: >-
      Reading one to ten sample messages from a topic. The Kafka REST v3 surface in this spec
      exposes produceRecord (POST records) but no consume operation — consumption over REST
      requires the self-managed Confluent REST Proxy, which is not part of the Cloud API spec.
rest_only:
  - capability: Cluster lifecycle (write)
    operations: [createCmkV2Cluster, updateCmkV2Cluster, deleteCmkV2Cluster]
    note: >-
      Deliberate. Confluent documents that you cannot create, change or delete clusters through
      MCP tools.
  - capability: Topic lifecycle (write)
    operations: [createKafkaTopic, deleteKafkaTopic, updatePartitionCountKafkaTopic]
    note: Deliberate — same read-only posture as clusters.
  - capability: Environment lifecycle (write)
    operations: [createOrgV2Environment, updateOrgV2Environment, deleteOrgV2Environment]
  - capability: Connector lifecycle beyond restart
    operations: [createConnectv1Connector, deleteConnectv1Connector, pauseConnectv1Connector, resumeConnectv1Connector, alterConnectv1ConnectorOffsetsRequest]
  - capability: Schema Registry writes
    operations: [register, deleteSubject, deleteSchemaVersion, lookUpSchemaUnderSubject]
  - capability: Topic and broker configuration
    operations: [updateKafkaTopicConfig, updateKafkaTopicConfigBatch, updateKafkaClusterConfig, updateKafkaClusterConfigs, deleteKafkaTopicConfig]
  - capability: Produce records
    operations: [produceRecord]
  - capability: IAM, RBAC, IP filtering, API keys, service accounts, notifications, networking, Flink, Tableflow, ksqlDB, Stream Sharing, service quotas, partner entitlements
    note: >-
      The bulk of the 504-operation Cloud API has no MCP tool at all. The managed servers cover
      discovery, connector operations, metrics, topics and schemas; everything else is REST-only.
