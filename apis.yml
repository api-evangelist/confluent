- aid: confluent:confluent-cloud-apis
  name: Confluent Cloud APIs
  description: >-
    The complete Confluent Cloud control-plane API — 504 operations across 15 independently
    versioned API groups covering Kafka cluster management (cmk/v2), the Kafka REST API (v3),
    Schema Registry (v1), Connect (v1), Flink (fcpm/v2, sql/v1), Tableflow (v1), IAM and RBAC
    (iam/v2), organizations and environments (org/v2), networking (v1), notifications (v1),
    service quotas (v1), Stream Sharing (cdx/v1) and partner entitlements (v2). Confluent
    publishes its API guidelines — errors, pagination, rate limiting, versioning and the
    deprecation policy — inside the OpenAPI document itself.
  humanURL: https://docs.confluent.io/cloud/current/api.html
  baseURL: https://api.confluent.cloud
  tags:
  - Data Streaming
  - Apache Kafka
  - Schema Registry
  - Apache Flink
  - Connectors
  properties:
  - type: OpenAPI
    url: openapi/confluent-cloud-openapi.yaml
  - type: APIReference
    url: https://docs.confluent.io/cloud/current/api.html
  - type: Overlay
    url: overlays/confluent-cloud-overlay.yaml
- aid: confluent:confluent-metrics-api
  name: Confluent Cloud Metrics API
  description: >-
    The Confluent Cloud telemetry surface — query and export time-series metrics for Kafka
    clusters, connectors, compute pools, ksqlDB and Schema Registry, discover target resources,
    and enumerate metric and resource descriptors. The export endpoint serves OpenMetrics and
    Prometheus text exposition formats, so an existing Prometheus or Grafana stack can scrape
    Confluent telemetry with no bespoke connector.
  humanURL: https://api.telemetry.confluent.cloud/docs
  baseURL: https://api.telemetry.confluent.cloud
  tags:
  - Metrics
  - Monitoring
  - Observability
  - OpenMetrics
  properties:
  - type: OpenAPI
    url: openapi/confluent-metrics-api-openapi.yaml
  - type: APIReference
    url: https://api.telemetry.confluent.cloud/docs
  - type: Overlay
    url: overlays/confluent-metrics-overlay.yaml
- aid: confluent:confluent-mcp
  name: Confluent Managed MCP Servers
  description: >-
    Confluent's managed remote Model Context Protocol servers. The global server at
    https://api.confluent.cloud/mcp/v1 provides tools for discovering environments and
    clusters, inspecting and debugging connectors (including AI-generated error summaries and
    fix recommendations) and querying metrics; a regional server provides topic and Schema
    Registry tools. Most tools are read-only and access is governed by existing Confluent Cloud
    RBAC. An open-source local-stdio server is also published as @confluentinc/mcp-confluent.
  humanURL: https://docs.confluent.io/cloud/current/ai/ai-tools/managed-mcp-server.html
  baseURL: https://api.confluent.cloud/mcp/v1
  tags:
  - MCP
  - AI Agents
  - Model Context Protocol
