compatibility_policy:
  published: true
  backward_compatibility: >-
    Confluent commits to non-breaking additive change without advance notice, and requires
    clients to tolerate it. See the Compatibility Policy section of the spec description for
    the full client-responsibility list.
  forward_compatibility: >-
    Documented, with implementation hints for clients.
  client_responsibility: >-
    Clients MUST follow the Compatibility Policy — tolerate new fields, new enum values and
    reordered collections — or their integration is not covered by the stability guarantee.
  undocumented_endpoints: >-
    Confluent states that any endpoint not documented in the API Reference is private, subject
    to change without notice, and not covered by any agreement.
