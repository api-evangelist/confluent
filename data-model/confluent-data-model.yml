    - {name: EnvScopedObjectReference, description: Reference to an object unique within one environment}
    - {name: TypedGlobalObjectReference, description: Global reference that also carries the referent's kind}
    - {name: TypedEnvScopedObjectReference, description: Environment-scoped reference carrying the referent's kind}
  extensions_observed:
