    kind: 'The object this REST resource represents, e.g. Cluster. readOnly.'
    id: Natural identifier, unique within scope and across time, never reclaimed after deletion.
    metadata: {self: addressable URL, resource_name: CRN, created_at: ISO 8601, updated_at: ISO 8601, deleted_at: ISO 8601}
    spec: The desired state of the object.
    status: The observed state, including phase.
