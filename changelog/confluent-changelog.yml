description: >-
  Confluent Cloud publishes a dated release-notes page, updated multiple times per week. Entries
  are feature announcements per release date; there is no per-API-group version number attached
  to an entry, and no separate breaking-change feed — breaking changes are communicated by email
  under the 180-day deprecation policy rather than in this changelog.
