entries:
  - date: '2026-08-26'
    breaking: false
    additions: true
    highlights:
      - IBM MQ Source connector now supports STRING and BYTES output data formats.
      - Output key format is now configurable for IBM MQ Source connectors.
      - Input key format is now configurable for IBM MQ Sink connectors.
  - date: '2026-08-25'
    breaking: false
    additions: true
    highlights:
      - >-
        Unified Stream Manager now supports alerting for registered Confluent Platform clusters
        — offline partitions, broker storage exhaustion, stalled telemetry — routed to the
        Console dashboard, email, Slack, Microsoft Teams or a generic webhook.
  - date: '2026-08-19'
    breaking: false
    additions: true
    highlights:
      - >-
        Secret manager integration extended to HTTP Sink V2, HTTP Source V2 and Oracle XStream
        CDC Source connectors.
      - >-
        Console idle session timeout increased from 30 minutes to two hours; inactivity is now
        measured by interaction rather than by an open browser tab. Eight-hour maximum session
        length unchanged.
  - date: '2026-08-18'
    breaking: false
    additions: true
    highlights:
      - Baseline CFU for an individual Flink SQL statement, as a Limited Availability feature.
      - >-
        Lightning Queries — read the Real-Time Context Engine's materialized table for a topic
        directly through an API without an agent (Early Access Program).
      - >-
        AI_FORECAST and AI_DETECT_ANOMALIES now support three IBM Granite time-series models
        (TTM, FlowState, PatchTST-FM) alongside Google TimesFM 2.5 (Early Access).
  - date: '2026-08-17'
    breaking: false
    additions: true
    highlights:
      - >-
        FROM_CHANGELOG and TO_CHANGELOG built-in changelog conversion functions for Confluent
        Cloud for Apache Flink are now generally available.
  - date: '2026-08-12'
    breaking: false
    additions: true
    highlights:
      - Advanced Message Search available for Open Preview in the Console message browser.
      - >-
        Secret manager integration extended to Amazon DynamoDB CDC Source and Amazon DynamoDB
        Sink connectors.
observations:
  - >-
    No entry in the observed two-week window is marked breaking. That is consistent with
    Confluent's stated policy: breaking changes land approximately once a year with 180 days of
    email notice, not in the rolling release notes.
  - >-
    The page is large (348KB as markdown) and is the single source for Confluent Cloud change
    communication; Confluent Platform and the CLI carry their own separate release notes.
