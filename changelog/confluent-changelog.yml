current_version_note: >-
  Confluent Cloud is continuously delivered and carries no aggregate product version. The
  closest thing to a version is the per-API-group path version (connect/v1, cmk/v2, srcm/v3).
cadence: multiple entries per week
window_start: '2026-08-12'
